<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RON微盘价值30 · 指数看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0b0e17; color: #e6edf5; padding: 24px; min-height: 100vh;
}
.container { max-width: 1440px; margin: 0 auto; }

.loading { text-align: center; padding: 80px 20px; color: #5a6a80; font-size: 18px; }
.loading .spinner {
    display: inline-block; width: 40px; height: 40px;
    border: 4px solid #1f2a3a; border-top-color: #f0c27f;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.header {
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; margin-bottom: 28px; padding: 20px 24px;
    background: linear-gradient(145deg, #141b26, #0f1620);
    border-radius: 20px; border: 1px solid #26303f;
}
.header-left h1 {
    font-size: 24px; font-weight: 700;
    background: linear-gradient(135deg, #f0c27f, #fc5c7d);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
}
.header-left .subtitle { font-size: 13px; color: #8899b0; margin-top: 6px; }
.header-left .subtitle span {
    display: inline-block; background: #1f2a3a; padding: 2px 12px;
    border-radius: 12px; margin-right: 6px;
}
.header-right { text-align: right; font-size: 13px; color: #8899b0; }
.header-right .highlight { color: #f0c27f; font-weight: 600; }

.kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px; margin-bottom: 28px;
}
.kpi-card {
    background: #141b26; border-radius: 14px; padding: 14px 16px;
    border: 1px solid #1f2a3a; text-align: center;
}
.kpi-label { font-size: 11px; text-transform: uppercase; color: #7a8aa0; margin-bottom: 4px; }
.kpi-value { font-size: 22px; font-weight: 700; }
.kpi-value.positive { color: #4cd9a0; }
.kpi-value.negative { color: #fc6b6b; }
.kpi-value.neutral  { color: #f0c27f; }

.chart-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px;
}
.chart-box {
    background: #141b26; border-radius: 16px; padding: 18px 18px 10px;
    border: 1px solid #1f2a3a;
}
.chart-box.full { grid-column: 1 / -1; }
.chart-box .chart-title {
    font-size: 15px; font-weight: 600; color: #c8d8e8;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.chart-box .chart-title .badge {
    font-size: 10px; background: #1f2a3a; padding: 1px 12px;
    border-radius: 12px; color: #8899b0; font-weight: 400;
}
.chart-wrapper { position: relative; height: 260px; }
.chart-wrapper.tall { height: 340px; }

.table-wrap { overflow-x: auto; margin-top: 6px; }
.table-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table-wrap th {
    text-align: left; padding: 8px 10px; color: #7a8aa0; font-weight: 500;
    font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #1f2a3a;
    white-space: nowrap;
}
.table-wrap td {
    padding: 7px 10px; border-bottom: 1px solid #1a222f; color: #d0dcec;
    white-space: nowrap;
}
.table-wrap .num { font-family: 'JetBrains Mono', monospace; text-align: right; }
.table-wrap .pos { color: #4cd9a0; }
.table-wrap .neg { color: #fc6b6b; }

.legend-inline {
    display: flex; gap: 18px; flex-wrap: wrap;
    margin-top: 6px; font-size: 12px; color: #8899b0;
}
.legend-inline .dot {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 3px; margin-right: 6px;
}
.text-muted { color: #5a6a80; font-size: 12px; }
.flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.hidden { display: none !important; }

/* 月度热力图 */
.heatmap-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.heatmap-table th {
    padding: 6px 8px; color: #7a8aa0; font-size: 11px;
    text-transform: uppercase; border-bottom: 1px solid #1f2a3a;
}
.heatmap-table td {
    padding: 7px 8px; text-align: center; color: #e6edf5;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid #0b0e17;
}
.heatmap-table td.year-cell {
    background: #141b26; color: #f0c27f; font-weight: 600;
    font-family: inherit; text-align: left;
}

@media (max-width: 900px) {
    .chart-grid { grid-template-columns: 1fr; }
    .header { flex-direction: column; gap: 10px; }
    .header-right { text-align: left; width: 100%; }
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 600px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    body { padding: 12px; }
}
</style>
</head>
<body>
<div class="container">
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>正在加载 RONVALUE30 指数数据 ...</div>
    </div>

    <div id="dashboard" class="hidden">
        <header class="header">
            <div class="header-left">
                <h1>🪙 RON微盘价值30 · 指数看板</h1>
                <div class="subtitle">
                    <span>RONVALUE30</span>
                    <span>📅 <span id="dateRange"></span></span>
                    <span id="latestPoint"></span>
                </div>
            </div>
            <div class="header-right">
                <div>微盘 · 价值 · 等权 30 <span class="highlight">成分</span></div>
            </div>
        </header>

        <div class="kpi-grid" id="kpiGrid"></div>

        <!-- 净值 + 回撤 -->
        <div class="chart-grid">
            <div class="chart-box full">
                <div class="chart-title">📈 累计净值 &amp; 回撤 <span class="badge">左轴净值 · 右轴回撤</span></div>
                <div class="chart-wrapper tall"><canvas id="navChart"></canvas></div>
                <div class="legend-inline">
                    <span><span class="dot" style="background:#f0c27f;"></span>累计净值</span>
                    <span><span class="dot" style="background:#fc6b6b;"></span>回撤(%)</span>
                </div>
            </div>
        </div>

        <!-- 年度收益 / 年度回撤 -->
        <div class="chart-grid">
            <div class="chart-box">
                <div class="chart-title">📊 年度收益率</div>
                <div class="chart-wrapper"><canvas id="annualBarChart"></canvas></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">📉 年度最大回撤</div>
                <div class="chart-wrapper"><canvas id="annualDrawdownChart"></canvas></div>
            </div>
        </div>

        <!-- 年度明细 -->
        <div class="chart-box full" style="margin-bottom:28px;">
            <div class="flex-between">
                <div class="chart-title">📋 年度业绩明细</div>
                <span class="text-muted">交易日数 · 风险调整指标</span>
            </div>
            <div class="table-wrap" id="annualTableWrap"></div>
        </div>

        <!-- 月度热力图 -->
        <div class="chart-box full" style="margin-bottom:28px;">
            <div class="flex-between">
                <div class="chart-title">🔥 月度收益热力图</div>
                <span class="text-muted">绿色为盈利 · 红色为亏损</span>
            </div>
            <div class="table-wrap" id="heatmapWrap"></div>
        </div>

        <!-- 权重 & 集中度 -->
        <div class="chart-grid">
            <div class="chart-box">
                <div class="chart-title">🧩 成分数量 &amp; 换手率</div>
                <div class="chart-wrapper"><canvas id="weightTurnoverChart"></canvas></div>
                <div class="legend-inline">
                    <span><span class="dot" style="background:#f0c27f;"></span>成分数</span>
                    <span><span class="dot" style="background:#4a90d9;"></span>换手率 %</span>
                </div>
            </div>
            <div class="chart-box">
                <div class="chart-title">🎯 权重集中度</div>
                <div class="chart-wrapper"><canvas id="concentrationChart"></canvas></div>
                <div class="legend-inline">
                    <span><span class="dot" style="background:#f0c27f;"></span>CR5</span>
                    <span><span class="dot" style="background:#4cd9a0;"></span>CR10</span>
                    <span><span class="dot" style="background:#fc5c7d;"></span>HHI</span>
                </div>
            </div>
        </div>

        <!-- 因子暴露 -->
        <div class="chart-grid">
            <div class="chart-box">
                <div class="chart-title">⚖️ 市值 &amp; 换手率暴露 <span class="badge">截面均值</span></div>
                <div class="chart-wrapper"><canvas id="factorCapChart"></canvas></div>
                <div class="legend-inline">
                    <span><span class="dot" style="background:#f0c27f;"></span>市值(亿)</span>
                    <span><span class="dot" style="background:#4a90d9;"></span>近20日换手率 %</span>
                </div>
            </div>
            <div class="chart-box">
                <div class="chart-title">💎 估值暴露 <span class="badge">PE / PB / PS</span></div>
                <div class="chart-wrapper"><canvas id="factorValueChart"></canvas></div>
                <div class="legend-inline">
                    <span><span class="dot" style="background:#4cd9a0;"></span>PE</span>
                    <span><span class="dot" style="background:#f0c27f;"></span>PB</span>
                    <span><span class="dot" style="background:#4a90d9;"></span>PS</span>
                </div>
            </div>
        </div>

        <!-- 最新成分 -->
        <div class="chart-box full">
            <div class="flex-between">
                <div class="chart-title">📌 最新一期成分股</div>
                <span class="text-muted" id="constituentDate"></span>
            </div>
            <div class="table-wrap" id="constituentTableWrap"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
// CSV 解析
// ============================================================
function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
    if (!lines.length) return [];
    const headers = lines[0].split(',').map(h => h.trim());
    const data = [];
    for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split(',').map(v => v.trim());
        if (values.length < headers.length) continue;
        const row = {};
        headers.forEach((h, idx) => {
            let v = values[idx] !== undefined ? values[idx] : '';
            if (v !== '' && !isNaN(v)) v = parseFloat(v);
            row[h] = v;
        });
        data.push(row);
    }
    return data;
}

// ============================================================
// 通用配色
// ============================================================
const COLOR = {
    gold:   '#f0c27f',
    blue:   '#4a90d9',
    pink:   '#fc5c7d',
    green:  '#4cd9a0',
    red:    '#fc6b6b',
    grid:   '#1a222f',
    tick:   '#8899b0',
};

const commonAxis = {
    x: { ticks: { maxTicksLimit: 12, color: COLOR.tick }, grid: { color: COLOR.grid } },
    y: { ticks: { color: COLOR.tick }, grid: { color: COLOR.grid } },
};

// ============================================================
// 加载文件
// ============================================================
const files = [
    'ron_metrics.csv',
    'ron_nav.csv',
    'ron_yearly_metrics.csv',
    'ron_monthly_pivot.csv',
    'ron_weight_stats.csv',
    'ron_factor_stats.csv',
    'ron_latest_constituents.csv',
];
const loaded = {};

Promise.all(files.map(f => fetch(f).then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status} — ${f}`);
    return r.text();
}).then(t => { loaded[f.replace('.csv','')] = parseCSV(t); })))
.then(() => {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    render(loaded);
})
.catch(err => {
    document.getElementById('loading').innerHTML = `
        <div style="color:#fc6b6b;font-size:20px;">⚠️ 数据加载失败</div>
        <div style="color:#8899b0;margin-top:12px;">${err.message}</div>
        <div style="color:#5a6a80;margin-top:8px;font-size:14px;">
            请确保以下 CSV 与 HTML 在同一目录：<br>
            ron_metrics.csv / ron_nav.csv / ron_yearly_metrics.csv /
            ron_monthly_pivot.csv / ron_weight_stats.csv /
            ron_factor_stats.csv / ron_latest_constituents.csv
        </div>`;
    console.error(err);
});

// ============================================================
// 主渲染
// ============================================================
function render(D) {
    const metrics = D.ron_metrics || [];
    const nav     = D.ron_nav || [];
    const yearly  = D.ron_yearly_metrics || [];
    const monthly = D.ron_monthly_pivot || [];
    const wstats  = D.ron_weight_stats || [];
    const fstats  = D.ron_factor_stats || [];
    const cons    = D.ron_latest_constituents || [];

    if (!nav.length) { alert('RONVALUE30 净值数据为空'); return; }

    // ---------- 头部 ----------
    const firstDate = nav[0].date;
    const lastDate  = nav[nav.length - 1].date;
    const lastNAV   = nav[nav.length - 1].累计净值;
    document.getElementById('dateRange').textContent = `${firstDate} ~ ${lastDate}`;
    document.getElementById('latestPoint').textContent = `最新净值 ${lastNAV.toFixed(2)}`;

    // ---------- KPI ----------
    const kpiMap = {};
    metrics.forEach(r => kpiMap[r['指标']] = r['数值']);
    const kpiConfig = [
        { key: '总收益率',   label: '总收益率',   fmt: v => (v*100).toFixed(1)+'%' },
        { key: '年化收益率', label: '年化收益',   fmt: v => (v*100).toFixed(1)+'%' },
        { key: '年化波动率', label: '年化波动',   fmt: v => (v*100).toFixed(1)+'%' },
        { key: '夏普比率',   label: '夏普比率',   fmt: v => v.toFixed(2) },
        { key: '最大回撤',   label: '最大回撤',   fmt: v => (v*100).toFixed(1)+'%' },
        { key: 'Calmar比率', label: 'Calmar',     fmt: v => v.toFixed(2) },
    ];
    const kpiGrid = document.getElementById('kpiGrid');
    kpiGrid.innerHTML = '';
    kpiConfig.forEach(cfg => {
        const v = kpiMap[cfg.key];
        let cls = 'neutral';
        if (v !== undefined) {
            if (cfg.key === '最大回撤') cls = v < 0 ? 'negative' : 'positive';
            else if (['总收益率','年化收益率','夏普比率','Calmar比率'].includes(cfg.key))
                cls = v > 0 ? 'positive' : 'negative';
        }
        const div = document.createElement('div');
        div.className = 'kpi-card';
        div.innerHTML = `
            <div class="kpi-label">${cfg.label}</div>
            <div class="kpi-value ${cls}">${v !== undefined ? cfg.fmt(v) : '--'}</div>`;
        kpiGrid.appendChild(div);
    });

    // ---------- 净值 + 回撤 ----------
    const navLabels = nav.map(d => d.date);
    const navValues = nav.map(d => d.累计净值);
    const ddValues  = nav.map(d => d.回撤 * 100);

    if (window._navChart) window._navChart.destroy();
    window._navChart = new Chart(document.getElementById('navChart'), {
        type: 'line',
        data: {
            labels: navLabels,
            datasets: [
                {
                    label: '累计净值', data: navValues,
                    borderColor: COLOR.gold,
                    backgroundColor: 'rgba(240,194,127,0.10)',
                    borderWidth: 2, pointRadius: 0, tension: 0.1,
                    yAxisID: 'y', fill: true,
                },
                {
                    label: '回撤 %', data: ddValues,
                    borderColor: COLOR.red,
                    backgroundColor: 'rgba(252,107,107,0.15)',
                    borderWidth: 1.2, pointRadius: 0, tension: 0.1,
                    yAxisID: 'y1', fill: true,
                },
            ],
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false } },
            scales: {
                x: commonAxis.x,
                y: {
                    position: 'left',
                    ticks: { color: COLOR.tick }, grid: { color: COLOR.grid },
                    title: { display: true, text: '净值', color: COLOR.tick },
                },
                y1: {
                    position: 'right',
                    ticks: { color: COLOR.tick, callback: v => v + '%' },
                    grid: { display: false },
                    title: { display: true, text: '回撤', color: COLOR.tick },
                },
            },
        },
    });

    // ---------- 年度柱状图 ----------
    const years = yearly.map(r => String(r.年份));
    const annualRet = yearly.map(r => r.总收益率 * 100);
    const annualDD  = yearly.map(r => r.最大回撤 * 100);

    if (window._barChart) window._barChart.destroy();
    window._barChart = new Chart(document.getElementById('annualBarChart'), {
        type: 'bar',
        data: {
            labels: years,
            datasets: [{
                data: annualRet,
                backgroundColor: annualRet.map(v => v >= 0
                    ? 'rgba(76,217,160,0.7)' : 'rgba(252,107,107,0.7)'),
                borderColor: annualRet.map(v => v >= 0 ? COLOR.green : COLOR.red),
                borderWidth: 1.5,
            }],
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { ticks: { callback: v => v + '%', color: COLOR.tick }, grid: { color: COLOR.grid } },
                x: { ticks: { color: COLOR.tick }, grid: { display: false } },
            },
        },
    });

    if (window._ddChart) window._ddChart.destroy();
    window._ddChart = new Chart(document.getElementById('annualDrawdownChart'), {
        type: 'bar',
        data: {
            labels: years,
            datasets: [{
                data: annualDD,
                backgroundColor: 'rgba(252,107,107,0.6)',
                borderColor: COLOR.red, borderWidth: 1.5,
            }],
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { ticks: { callback: v => v + '%', color: COLOR.tick }, grid: { color: COLOR.grid } },
                x: { ticks: { color: COLOR.tick }, grid: { display: false } },
            },
        },
    });

    // ---------- 年度明细表 ----------
    let tableHtml = `<table><thead><tr>
        <th>年份</th><th>总收益率</th><th>年化收益率</th><th>年化波动率</th>
        <th>夏普比率</th><th>最大回撤</th><th>Calmar</th><th>交易日</th>
    </tr></thead><tbody>`;
    yearly.forEach(r => {
        const tr = r.总收益率, ar = r.年化收益率, av = r.年化波动率;
        const sp = r.夏普比率, md = r.最大回撤, cm = r.Calmar比率, dy = r.交易日数;
        tableHtml += `<tr>
            <td>${r.年份}</td>
            <td class="num ${tr>=0?'pos':'neg'}">${(tr*100).toFixed(1)}%</td>
            <td class="num ${ar>=0?'pos':'neg'}">${(ar*100).toFixed(1)}%</td>
            <td class="num">${(av*100).toFixed(1)}%</td>
            <td class="num">${sp.toFixed(2)}</td>
            <td class="num neg">${(md*100).toFixed(1)}%</td>
            <td class="num">${cm.toFixed(2)}</td>
            <td class="num">${dy}</td>
        </tr>`;
    });
    tableHtml += '</tbody></table>';
    document.getElementById('annualTableWrap').innerHTML = tableHtml;

    // ---------- 月度热力图 ----------
    renderHeatmap(monthly);

    // ---------- 成分 & 换手率 ----------
    const wDates = wstats.map(r => r.date);
    const wCount = wstats.map(r => r.成分数);
    const wTurn  = wstats.map(r => r.换手率 * 100);

    if (window._wtChart) window._wtChart.destroy();
    window._wtChart = new Chart(document.getElementById('weightTurnoverChart'), {
        type: 'line',
        data: {
            labels: wDates,
            datasets: [
                {
                    label: '成分数', data: wCount,
                    borderColor: COLOR.gold, backgroundColor: 'rgba(240,194,127,0.10)',
                    borderWidth: 2, pointRadius: 0, tension: 0.15, yAxisID: 'y',
                },
                {
                    label: '换手率 %', data: wTurn,
                    borderColor: COLOR.blue, borderWidth: 1.8,
                    pointRadius: 0, tension: 0.15, yAxisID: 'y1',
                },
            ],
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false } },
            scales: {
                x: commonAxis.x,
                y: { position: 'left', ticks: { color: COLOR.tick }, grid: { color: COLOR.grid } },
                y1: {
                    position: 'right',
                    ticks: { color: COLOR.tick, callback: v => v + '%' },
                    grid: { display: false },
                },
            },
        },
    });

    // ---------- 集中度 ----------
    const cr5  = wstats.map(r => r.CR5  * 100);
    const cr10 = wstats.map(r => r.CR10 * 100);
    const hhi  = wstats.map(r => r.HHI  * 100);

    if (window._ccChart) window._ccChart.destroy();
    window._ccChart = new Chart(document.getElementById('concentrationChart'), {
        type: 'line',
        data: {
            labels: wDates,
            datasets: [
                { label: 'CR5',  data: cr5,  borderColor: COLOR.gold,  borderWidth: 1.8, pointRadius: 0, tension: 0.15 },
                { label: 'CR10', data: cr10, borderColor: COLOR.green, borderWidth: 1.8, pointRadius: 0, tension: 0.15 },
                { label: 'HHI',  data: hhi,  borderColor: COLOR.pink,  borderWidth: 1.8, pointRadius: 0, tension: 0.15, borderDash: [4,4] },
            ],
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false } },
            scales: {
                x: commonAxis.x,
                y: { ticks: { callback: v => v + '%', color: COLOR.tick }, grid: { color: COLOR.grid } },
            },
        },
    });

    // ---------- 因子：市值 & 换手率 ----------
    const fDates = fstats.map(r => r.date);
    const fCap   = fstats.map(r => r.market_cap);
    const fTurn  = fstats.map(r => r['近20日换手率(%)']);

    if (window._fcChart) window._fcChart.destroy();
    window._fcChart = new Chart(document.getElementById('factorCapChart'), {
        type: 'line',
        data: {
            labels: fDates,
            datasets: [
                {
                    label: '市值(亿)', data: fCap,
                    borderColor: COLOR.gold, backgroundColor: 'rgba(240,194,127,0.10)',
                    borderWidth: 2, pointRadius: 0, tension: 0.15, yAxisID: 'y', fill: true,
                },
                {
                    label: '换手率 %', data: fTurn,
                    borderColor: COLOR.blue, borderWidth: 1.8,
                    pointRadius: 0, tension: 0.15, yAxisID: 'y1',
                },
            ],
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false } },
            scales: {
                x: commonAxis.x,
                y: { position: 'left', ticks: { color: COLOR.tick }, grid: { color: COLOR.grid } },
                y1: {
                    position: 'right',
                    ticks: { color: COLOR.tick, callback: v => v + '%' },
                    grid: { display: false },
                },
            },
        },
    });

    // ---------- 因子：估值 ----------
    const fPE = fstats.map(r => r.pe_ratio);
    const fPB = fstats.map(r => r.pb_ratio);
    const fPS = fstats.map(r => r.ps_ratio);

    if (window._fvChart) window._fvChart.destroy();
    window._fvChart = new Chart(document.getElementById('factorValueChart'), {
        type: 'line',
        data: {
            labels: fDates,
            datasets: [
                { label: 'PE', data: fPE, borderColor: COLOR.green, borderWidth: 1.8, pointRadius: 0, tension: 0.15 },
                { label: 'PB', data: fPB, borderColor: COLOR.gold,  borderWidth: 1.8, pointRadius: 0, tension: 0.15 },
                { label: 'PS', data: fPS, borderColor: COLOR.blue,  borderWidth: 1.8, pointRadius: 0, tension: 0.15 },
            ],
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false } },
            scales: {
                x: commonAxis.x,
                y: { ticks: { color: COLOR.tick }, grid: { color: COLOR.grid } },
            },
        },
    });

    // ---------- 最新成分表 ----------
    if (cons.length) {
        document.getElementById('constituentDate').textContent = `更新于 ${lastDate}`;
        let ch = `<table><thead><tr>
            <th>#</th><th>代码</th><th>名称</th><th>交易所</th><th style="text-align:right;">权重</th>
        </tr></thead><tbody>`;
        cons.forEach((c, i) => {
            const w = Number(c['权重%'] || 0);
            ch += `<tr>
                <td>${i+1}</td>
                <td>${c.代码}</td>
                <td>${c.名称}</td>
                <td class="text-muted">${c.交易所 || ''}</td>
                <td class="num">${w.toFixed(2)}%</td>
            </tr>`;
        });
        ch += '</tbody></table>';
        document.getElementById('constituentTableWrap').innerHTML = ch;
    }
}

// ============================================================
// 月度热力图渲染
// ============================================================
function renderHeatmap(rows) {
    if (!rows || !rows.length) {
        document.getElementById('heatmapWrap').innerHTML =
            '<div class="text-muted" style="padding:12px;">暂无月度数据</div>';
        return;
    }
    const monthKeys = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    // 找最大绝对值
    let maxAbs = 0;
    rows.forEach(r => monthKeys.forEach(m => {
        const v = r[m];
        if (typeof v === 'number' && !isNaN(v)) maxAbs = Math.max(maxAbs, Math.abs(v));
    }));
    if (maxAbs === 0) maxAbs = 0.01;

    const cellColor = v => {
        if (typeof v !== 'number' || isNaN(v)) return 'rgba(31,42,58,0.4)';
        const intensity = Math.min(1, Math.abs(v) / maxAbs);
        const alpha = 0.10 + intensity * 0.65;
        return v >= 0
            ? `rgba(76,217,160,${alpha})`
            : `rgba(252,107,107,${alpha})`;
    };

    let html = `<table class="heatmap-table"><thead><tr><th>年份</th>`;
    monthKeys.forEach(m => html += `<th>${m}</th>`);
    html += `<th>全年</th></tr></thead><tbody>`;

    rows.forEach(r => {
        html += `<tr><td class="year-cell">${r.year}</td>`;
        let annual = 1;
        let hasAnnual = false;
        monthKeys.forEach(m => {
            const v = r[m];
            if (typeof v === 'number' && !isNaN(v)) {
                html += `<td style="background:${cellColor(v)}">${(v*100).toFixed(1)}%</td>`;
                annual *= (1 + v);
                hasAnnual = true;
            } else {
                html += `<td style="background:${cellColor(NaN)}">–</td>`;
            }
        });
        const annualRet = hasAnnual ? annual - 1 : NaN;
        html += `<td style="background:${cellColor(annualRet)};font-weight:600;">${isNaN(annualRet)?'–':(annualRet*100).toFixed(1)+'%'}</td>`;
        html += `</tr>`;
    });

    html += '</tbody></table>';
    document.getElementById('heatmapWrap').innerHTML = html;
}
</script>
