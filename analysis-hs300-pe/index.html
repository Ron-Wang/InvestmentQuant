<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沪深300 PE百分位 · 分布分析</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js">
    </script>
    <style>
        /* ===== 深色主题（统一风格） ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0b0e17;
            color: #e6edf5;
            padding: 24px;
            min-height: 100vh;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 80px 20px;
            color: #5a6a80;
            font-size: 18px;
        }
        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #1f2a3a;
            border-top-color: #f0c27f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        .loading .progress-text {
            color: #7a8aa0;
            font-size: 14px;
            margin-top: 8px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            background: #141b26;
            padding: 20px 28px;
            border-radius: 20px;
            border: 1px solid #26303f;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0c27f, #fc5c7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .sub {
            font-size: 13px;
            color: #8899b0;
            margin-top: 4px;
        }
        .header .badge {
            background: #1a2332;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            color: #7a8aa0;
            border: 1px solid #26303f;
        }

        /* KPI */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .kpi-card {
            background: #141b26;
            padding: 16px 18px;
            border-radius: 16px;
            border: 1px solid #1f2a3a;
            transition: border-color 0.2s;
        }
        .kpi-card:hover {
            border-color: #f0c27f;
        }
        .kpi-label {
            font-size: 12px;
            font-weight: 500;
            color: #7a8aa0;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        .kpi-value {
            font-size: 28px;
            font-weight: 700;
            color: #f0c27f;
        }
        .kpi-sub {
            font-size: 12px;
            color: #5a6a80;
            margin-top: 4px;
        }

        /* 图表 */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-box {
            background: #141b26;
            border-radius: 16px;
            padding: 16px 16px 6px;
            border: 1px solid #1f2a3a;
        }
        .chart-box.full-width {
            grid-column: 1 / -1;
        }
        .chart-title {
            font-size: 15px;
            font-weight: 600;
            color: #c8d8e8;
            margin-bottom: 8px;
            padding-left: 4px;
        }
        .chart-container {
            width: 100%;
            height: 350px;
        }
        .chart-container.trend {
            height: 330px;
        }

        /* 分析框 */
        .analysis-box {
            background: #141b26;
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid #1f2a3a;
            margin-top: 20px;
        }
        .analysis-box h2 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #f0c27f;
            border-left: 4px solid #f0c27f;
            padding-left: 14px;
        }
        .analysis-flex {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        .analysis-text p {
            line-height: 1.8;
            color: #d0dcec;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .analysis-text strong {
            color: #f0c27f;
        }
        .extreme-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .extreme-col {
            background: #1a2332;
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #26303f;
        }
        .extreme-col h4 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .extreme-col h4.low {
            color: #4cd9a0;
        }
        .extreme-col h4.high {
            color: #fc6b6b;
        }
        .extreme-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 4px 0;
            border-bottom: 1px dashed #26303f;
            color: #b8c9dd;
        }
        .extreme-item:last-child {
            border-bottom: none;
        }
        .stock-name {
            color: #d0dcec;
        }
        .stock-pct.low {
            color: #4cd9a0;
            font-weight: 600;
        }
        .stock-pct.high {
            color: #fc6b6b;
            font-weight: 600;
        }
        .no-data-msg {
            color: #5a6a80;
            text-align: center;
            padding: 40px 0;
            font-size: 16px;
        }

        @media (max-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .analysis-flex {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
        }
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .chart-container {
                height: 260px;
            }
            .chart-container.trend {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 加载提示 -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>正在加载数据 ...</div>
            <div class="progress-text" id="progressText">准备读取 CSV 文件</div>
        </div>

        <!-- 看板 -->
        <div id="dashboard" style="display:none;">
            <div class="header">
                <div>
                    <h1>📈 沪深300 · PE百分位分布</h1>
                    <div class="sub">自动加载同目录下所有 <strong>hs300_pe_percentile_*.csv</strong> 文件</div>
                </div>
                <span class="badge" id="fileInfo">加载中...</span>
            </div>

            <div class="kpi-grid" id="kpiContainer">
                <div class="kpi-card"><div class="kpi-label">📅 最新日期</div><div class="kpi-value" id="kpiDate">--</div><div class="kpi-sub">数据快照</div></div>
                <div class="kpi-card"><div class="kpi-label">📊 平均百分位</div><div class="kpi-value" id="kpiMean">--</div><div class="kpi-sub">全市场估值中枢</div></div>
                <div class="kpi-card"><div class="kpi-label">📐 中位数百分位</div><div class="kpi-value" id="kpiMedian">--</div><div class="kpi-sub">典型个股估值水平</div></div>
                <div class="kpi-card"><div class="kpi-label">⚖️ 高估/低估 比</div><div class="kpi-value" id="kpiRatio">--</div><div class="kpi-sub">>80% 高位 / <20% 低位</div></div>
            </div>

            <div class="charts-grid">
                <div class="chart-box">
                    <div class="chart-title">📉 分布密度曲线 (PDF)</div>
                    <div id="chartDist" class="chart-container"></div>
                </div>
                <div class="chart-box">
                    <div class="chart-title">📈 累积分布曲线 (CDF)</div>
                    <div id="chartCumulative" class="chart-container"></div>
                </div>
            </div>

            <div class="chart-box full-width">
                <div class="chart-title">📊 估值分位数趋势 (P10, P25, P50, P75, P90)</div>
                <div id="chartTrend" class="chart-container trend"></div>
            </div>

            <div class="analysis-box" id="analysisBox">
                <h2>🧠 最新情况深度分析</h2>
                <div id="analysisContent">
                    <div class="no-data-msg">正在生成分析...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  🔧 用户配置区：在此列出所有 CSV 文件名
        //  如果同目录下有 files.json，将自动使用其中的列表（优先级更高）
        // ================================================================
        const CSV_FILES = [
            'hs300_pe_percentile_2015-06-08.csv',
            // 在此添加更多 CSV 文件，例如：
            // 'hs300_pe_percentile_2015-06-09.csv',
            // 'hs300_pe_percentile_2015-06-10.csv',
        ];

        // ================================================================
        //  数据存储与辅助函数
        // ================================================================
        const allData = {};
        let loadedCount = 0;
        let totalFiles = 0;

        function extractDateFromFilename(filename) {
            const match = filename.match(/(\d{4}-\d{2}-\d{2})/);
            return match ? match[1] : null;
        }

        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length === 0) return [];
            const header = lines[0].replace(/^\uFEFF/, '').split(',');
            const idxName = header.indexOf('name');
            const idxPct = header.indexOf('percentile');
            const idxPe = header.indexOf('pe_ttm');
            const idxPositive = header.indexOf('is_positive');
            if (idxPct === -1 || idxName === -1) return [];

            const results = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                if (cols.length <= Math.max(idxPct, idxName)) continue;
                const isPos = idxPositive !== -1 ? cols[idxPositive].trim() : 'True';
                if (isPos !== 'True') continue;
                const pct = parseFloat(cols[idxPct]);
                if (isNaN(pct) || pct < 0 || pct > 100) continue;
                results.push({
                    name: cols[idxName] || 'Unknown',
                    percentile: pct,
                    pe: idxPe !== -1 ? parseFloat(cols[idxPe]) || 0 : 0
                });
            }
            return results;
        }

        function getStats(arr) {
            if (!arr || arr.length === 0) return null;
            const sorted = [...arr].sort((a, b) => a - b);
            const n = sorted.length;
            const mean = sorted.reduce((s, v) => s + v, 0) / n;
            const median = n % 2 === 0 ? (sorted[n / 2 - 1] + sorted[n / 2]) / 2 : sorted[Math.floor(n / 2)];
            const p10 = sorted[Math.floor(n * 0.10)];
            const p25 = sorted[Math.floor(n * 0.25)];
            const p75 = sorted[Math.floor(n * 0.75)];
            const p90 = sorted[Math.floor(n * 0.90)];
            const bins = Array(10).fill(0);
            sorted.forEach(v => {
                const idx = Math.min(9, Math.floor(v / 10));
                bins[idx] += 1;
            });
            const dist = bins.map(c => (c / n) * 100);
            return { mean, median, p10, p25, p75, p90, dist, count: n, sorted };
        }

        function getQuantiles(arr) {
            if (!arr || arr.length === 0) return null;
            const sorted = [...arr].sort((a, b) => a - b);
            const n = sorted.length;
            return {
                p10: sorted[Math.floor(n * 0.10)],
                p25: sorted[Math.floor(n * 0.25)],
                p50: n % 2 === 0 ? (sorted[n / 2 - 1] + sorted[n / 2]) / 2 : sorted[Math.floor(n / 2)],
                p75: sorted[Math.floor(n * 0.75)],
                p90: sorted[Math.floor(n * 0.90)]
            };
        }

        // ================================================================
        //  图表渲染（深色主题）
        // ================================================================
        let chartInstances = {};

        function getChart(id) {
            const dom = document.getElementById(id);
            if (!dom) return null;
            if (!chartInstances[id]) {
                chartInstances[id] = echarts.init(dom, 'dark');
                window.addEventListener('resize', () => {
                    if (chartInstances[id]) chartInstances[id].resize();
                });
            }
            return chartInstances[id];
        }

        function renderDistChart(dates) {
            const chart = getChart('chartDist');
            if (!chart) return;
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross' },
                    formatter: function(params) {
                        let res = `<strong>${params[0].axisValue}</strong><br/>`;
                        params.forEach(p => {
                            if (p.value !== null && p.value[1] !== undefined) {
                                res += `${p.marker} ${p.seriesName}: ${p.value[1].toFixed(2)}%<br/>`;
                            }
                        });
                        return res;
                    }
                },
                legend: { data: dates, type: 'scroll', bottom: 0, icon: 'circle', itemWidth: 8,
                    textStyle: { color: '#b8c9dd' } },
                grid: { left: '3%', right: '4%', bottom: '22%', top: '5%', containLabel: true },
                xAxis: {
                    type: 'value',
                    min: 0,
                    max: 100,
                    name: '百分位',
                    nameLocation: 'center',
                    nameGap: 25,
                    nameTextStyle: { color: '#8899b0' },
                    splitLine: { lineStyle: { color: '#1f2a3a', type: 'dashed' } },
                    axisLabel: { color: '#8899b0' }
                },
                yAxis: {
                    type: 'value',
                    name: '频率密度 (%)',
                    nameTextStyle: { color: '#8899b0' },
                    splitLine: { lineStyle: { color: '#1f2a3a', type: 'dashed' } },
                    axisLabel: { color: '#8899b0' }
                },
                series: dates.map((date, index) => {
                    const data = allData[date];
                    const bins = Array(10).fill(0);
                    data.percentiles.forEach(v => {
                        const idx = Math.min(9, Math.floor(v / 10));
                        bins[idx] += 1;
                    });
                    const total = data.percentiles.length;
                    const freq = bins.map(c => (c / total) * 100);
                    const xAxis = [5, 15, 25, 35, 45, 55, 65, 75, 85, 95];
                    const colors = ['#f0c27f', '#4cd9a0', '#4a90d9', '#fc5c7d', '#8b5cf6', '#f59e0b'];
                    return {
                        name: date,
                        type: 'line',
                        smooth: true,
                        symbol: 'none',
                        lineStyle: { width: 2.5, color: colors[index % colors.length] },
                        data: xAxis.map((x, i) => [x, freq[i]])
                    };
                })
            };
            chart.setOption(option, true);
            chart.resize();
        }

        function renderCumulativeChart(dates) {
            const chart = getChart('chartCumulative');
            if (!chart) return;
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross' },
                    formatter: function(params) {
                        let res = `<strong>${params[0].axisValue}</strong><br/>`;
                        params.forEach(p => {
                            if (p.value !== null && p.value[1] !== undefined) {
                                res += `${p.marker} ${p.seriesName}: ${p.value[1].toFixed(2)}%<br/>`;
                            }
                        });
                        return res;
                    }
                },
                legend: { data: dates, type: 'scroll', bottom: 0, icon: 'circle', itemWidth: 8,
                    textStyle: { color: '#b8c9dd' } },
                grid: { left: '3%', right: '4%', bottom: '22%', top: '5%', containLabel: true },
                xAxis: {
                    type: 'value',
                    min: 0,
                    max: 100,
                    name: '百分位',
                    nameLocation: 'center',
                    nameGap: 25,
                    nameTextStyle: { color: '#8899b0' },
                    splitLine: { lineStyle: { color: '#1f2a3a', type: 'dashed' } },
                    axisLabel: { color: '#8899b0' }
                },
                yAxis: {
                    type: 'value',
                    min: 0,
                    max: 100,
                    name: '累计比例 (%)',
                    nameTextStyle: { color: '#8899b0' },
                    splitLine: { lineStyle: { color: '#1f2a3a', type: 'dashed' } },
                    axisLabel: { color: '#8899b0' }
                },
                series: dates.map((date, index) => {
                    const pcts = allData[date].percentiles;
                    const sorted = [...pcts].sort((a, b) => a - b);
                    const total = sorted.length;
                    const step = Math.max(1, Math.floor(total / 200));
                    const dataPoints = [];
                    for (let i = 0; i < total; i += step) {
                        const p = sorted[i];
                        const cum = ((i + 1) / total) * 100;
                        dataPoints.push([p, cum]);
                    }
                    if (dataPoints.length > 0 && dataPoints[dataPoints.length - 1][0] !== sorted[sorted.length - 1]) {
                        dataPoints.push([sorted[sorted.length - 1], 100]);
                    }
                    const colors = ['#f0c27f', '#4cd9a0', '#4a90d9', '#fc5c7d', '#8b5cf6', '#f59e0b'];
                    return {
                        name: date,
                        type: 'line',
                        smooth: true,
                        symbol: 'none',
                        lineStyle: { width: 2.5, color: colors[index % colors.length] },
                        data: dataPoints
                    };
                })
            };
            chart.setOption(option, true);
            chart.resize();
        }

        function renderTrendChart(dates) {
            const chart = getChart('chartTrend');
            if (!chart) return;
            const p10 = [],
                p25 = [],
                p50 = [],
                p75 = [],
                p90 = [];
            dates.forEach(date => {
                const q = getQuantiles(allData[date].percentiles);
                if (q) {
                    p10.push(q.p10);
                    p25.push(q.p25);
                    p50.push(q.p50);
                    p75.push(q.p75);
                    p90.push(q.p90);
                } else {
                    p10.push(null);
                    p25.push(null);
                    p50.push(null);
                    p75.push(null);
                    p90.push(null);
                }
            });

            const option = {
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        let res = `<strong>${params[0].axisValue}</strong><br/>`;
                        params.forEach(p => {
                            if (p.value !== null) {
                                res += `${p.marker} ${p.seriesName}: ${p.value.toFixed(2)}%<br/>`;
                            }
                        });
                        return res;
                    }
                },
                legend: {
                    data: ['P10', 'P25', 'P50 (中位数)', 'P75', 'P90'],
                    bottom: 0,
                    icon: 'circle',
                    itemWidth: 8,
                    textStyle: { color: '#b8c9dd' }
                },
                grid: { left: '3%', right: '4%', bottom: '22%', top: '5%', containLabel: true },
                xAxis: {
                    type: 'category',
                    data: dates,
                    axisLabel: { rotate: 30, fontSize: 11, color: '#8899b0' },
                    axisLine: { lineStyle: { color: '#26303f' } }
                },
                yAxis: {
                    type: 'value',
                    min: 0,
                    max: 100,
                    name: '百分位',
                    nameTextStyle: { color: '#8899b0' },
                    splitLine: { lineStyle: { color: '#1f2a3a', type: 'dashed' } },
                    axisLabel: { color: '#8899b0' }
                },
                series: [{
                    name: 'P10',
                    type: 'line',
                    data: p10,
                    smooth: true,
                    lineStyle: { width: 1.5, opacity: 0.6, color: '#4a90d9' },
                    symbol: 'none'
                }, {
                    name: 'P25',
                    type: 'line',
                    data: p25,
                    smooth: true,
                    lineStyle: { width: 2, color: '#3b82f6' },
                    symbol: 'none'
                }, {
                    name: 'P50 (中位数)',
                    type: 'line',
                    data: p50,
                    smooth: true,
                    lineStyle: { width: 3, color: '#f0c27f' },
                    symbol: 'circle',
                    symbolSize: 6,
                    itemStyle: { color: '#f0c27f' }
                }, {
                    name: 'P75',
                    type: 'line',
                    data: p75,
                    smooth: true,
                    lineStyle: { width: 2, color: '#3b82f6' },
                    symbol: 'none'
                }, {
                    name: 'P90',
                    type: 'line',
                    data: p90,
                    smooth: true,
                    lineStyle: { width: 1.5, opacity: 0.6, color: '#4a90d9' },
                    symbol: 'none'
                }]
            };
            chart.setOption(option, true);
            chart.resize();
        }

        // ================================================================
        //  更新仪表盘
        // ================================================================
        function updateDashboard() {
            const dates = Object.keys(allData).sort();
            if (dates.length === 0) {
                document.getElementById('loading').innerHTML =
                    '<div style="color:#fc6b6b;font-size:20px;">⚠️ 未找到有效数据</div>' +
                    '<div style="color:#8899b0;margin-top:12px;">请确保目录下存在 <strong>hs300_pe_percentile_*.csv</strong> 文件。</div>' +
                    '<div style="color:#5a6a80;margin-top:8px;font-size:14px;">' +
                    '已在 <strong>files.json</strong> 或 <strong>CSV_FILES</strong> 中配置文件名，且每个文件包含 name, percentile, is_positive 列。' +
                    '</div>';
                return;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('fileInfo').textContent = `${dates.length} 个日期`;

            const latest = dates[dates.length - 1];
            const latestData = allData[latest];
            const pcts = latestData.percentiles;
            const stats = getStats(pcts);
            const stocks = latestData.stocks;

            document.getElementById('kpiDate').innerText = latest;
            document.getElementById('kpiMean').innerText = stats.mean.toFixed(1) + '%';
            document.getElementById('kpiMedian').innerText = stats.median.toFixed(1) + '%';

            const highCount = pcts.filter(p => p > 80).length;
            const lowCount = pcts.filter(p => p < 20).length;
            const ratio = lowCount === 0 ? '∞' : (highCount / lowCount).toFixed(2);
            document.getElementById('kpiRatio').innerHTML =
                `${highCount}/${lowCount} <span style="font-size:14px;font-weight:400;color:#5a6a80;">(高/低)</span>`;

            renderDistChart(dates);
            renderCumulativeChart(dates);
            renderTrendChart(dates);

            // 深度分析
            const sorted = [...stocks].sort((a, b) => a.percentile - b.percentile);
            const low = sorted.filter(s => s.percentile < 10);
            const high = sorted.filter(s => s.percentile > 90);

            const lowList = low.slice(0, 6).map(s =>
                `<div class="extreme-item"><span class="stock-name">${s.name}</span><span class="stock-pct low">${s.percentile.toFixed(1)}%</span></div>`
            ).join('');
            const highList = high.slice(0, 6).map(s =>
                `<div class="extreme-item"><span class="stock-name">${s.name}</span><span class="stock-pct high">${s.percentile.toFixed(1)}%</span></div>`
            ).join('');

            const pctLow20 = (stats.sorted.filter(v => v < 20).length / stats.count * 100).toFixed(1);
            const pctHigh80 = (stats.sorted.filter(v => v > 80).length / stats.count * 100).toFixed(1);
            const status = stats.median > 60 ? '偏高估区域' : (stats.median > 40 ? '中性区域' : '偏低估区域');
            const ratioDisplay = (stats.sorted.filter(v => v > 80).length / Math.max(1, stats.sorted.filter(v => v < 20)
                .length)).toFixed(2);

            document.getElementById('analysisContent').innerHTML = `
                <div class="analysis-flex">
                    <div class="analysis-text">
                        <p><strong>📅 最新快照：${latest}</strong></p>
                        <p>🔹 全市场平均百分位为 <strong>${stats.mean.toFixed(1)}%</strong>，中位数为 <strong>${stats.median.toFixed(1)}%</strong>，整体处于 <strong>${status}</strong>。</p>
                        <p>🔹 当前有 <strong>${pctLow20}%</strong> 的股票处于历史低位（<20%），而有 <strong>${pctHigh80}%</strong> 的股票处于历史高位（>80%）。</p>
                        <p>🔹 高估/低估比率为 <strong>${ratioDisplay}</strong>，表明市场情绪偏向于 <strong>${parseFloat(pctHigh80) > parseFloat(pctLow20) ? '高估（需谨慎）' : '低估（可关注）'}</strong>。</p>
                        <p style="color:#7a8aa0; font-size:13px; margin-top:8px;">* 百分位越低代表估值越接近历史底部，反之则接近历史顶部。</p>
                    </div>
                    <div class="extreme-list">
                        <div class="extreme-col">
                            <h4 class="low">🟢 极度低估 (&lt;10%)</h4>
                            ${lowList || '无'}
                        </div>
                        <div class="extreme-col">
                            <h4 class="high">🔴 极度高估 (&gt;90%)</h4>
                            ${highList || '无'}
                        </div>
                    </div>
                </div>
            `;
        }

        // ================================================================
        //  主加载：读取 CSV 文件列表
        // ================================================================
        function loadCSVFiles(fileList) {
            totalFiles = fileList.length;
            if (totalFiles === 0) {
                document.getElementById('loading').innerHTML =
                    '<div style="color:#f0c27f;font-size:20px;">📂 未配置 CSV 文件</div>' +
                    '<div style="color:#8899b0;margin-top:12px;">请在 <strong>files.json</strong> 或 <strong>CSV_FILES</strong> 数组中添加文件名。</div>';
                return;
            }

            let loaded = 0;
            const progressText = document.getElementById('progressText');

            fileList.forEach(filename => {
                const date = extractDateFromFilename(filename);
                if (!date) {
                    loaded++;
                    updateProgress(loaded, totalFiles);
                    return;
                }

                fetch(filename)
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.text();
                    })
                    .then(text => {
                        const parsed = parseCSV(text);
                        if (parsed.length > 0) {
                            allData[date] = {
                                percentiles: parsed.map(d => d.percentile),
                                stocks: parsed
                            };
                        } else {
                            console.warn('CSV 无有效数据:', filename);
                        }
                        loaded++;
                        updateProgress(loaded, totalFiles);
                        if (loaded === totalFiles) {
                            updateDashboard();
                        }
                    })
                    .catch(err => {
                        console.error('加载失败:', filename, err);
                        loaded++;
                        updateProgress(loaded, totalFiles);
                        if (loaded === totalFiles) {
                            updateDashboard();
                        }
                    });
            });
        }

        function updateProgress(current, total) {
            const pct = Math.round((current / total) * 100);
            const el = document.getElementById('progressText');
            if (el) {
                el.textContent = `加载中 ${current}/${total} (${pct}%)`;
            }
        }

        // ---- 启动加载 ----
        // 优先尝试加载 files.json，如果不存在则使用硬编码 CSV_FILES
        fetch('files.json')
            .then(res => {
                if (res.ok) return res.json();
                throw new Error('files.json 不存在，使用硬编码列表');
            })
            .then(json => {
                if (json && Array.isArray(json.files)) {
                    document.getElementById('progressText').textContent = `从 files.json 读取到 ${json.files.length} 个文件`;
                    loadCSVFiles(json.files);
                } else {
                    throw new Error('files.json 格式无效，使用硬编码列表');
                }
            })
            .catch(() => {
                // 回退到硬编码列表
                if (CSV_FILES.length > 0) {
                    document.getElementById('progressText').textContent =
                        `使用硬编码列表，共 ${CSV_FILES.length} 个文件（如需动态列表，请创建 files.json）`;
                    loadCSVFiles(CSV_FILES);
                } else {
                    document.getElementById('loading').innerHTML =
                        '<div style="color:#f0c27f;font-size:20px;">📂 请配置 CSV 文件</div>' +
                        '<div style="color:#8899b0;margin-top:12px;">在 HTML 中修改 <strong>CSV_FILES</strong> 数组，或创建 <strong>files.json</strong> 文件。</div>' +
                        '<div style="color:#5a6a80;margin-top:8px;font-size:14px;">' +
                        '示例 files.json: { "files": ["hs300_pe_percentile_2015-06-08.csv"] }' +
                        '</div>';
                }
            });
    </script>
</body>
</html>
