<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MABS · 全球多资产等权策略 · 季度再平衡</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0b0e17;
        color: #e6edf5;
        padding: 24px;
        min-height: 100vh;
    }
    .container { max-width: 1440px; margin: 0 auto; }

    .loading { text-align: center; padding: 80px 20px; color: #5a6a80; font-size: 18px; }
    .loading .spinner {
        display: inline-block; width: 40px; height: 40px;
        border: 4px solid #1f2a3a; border-top-color: #f0c27f;
        border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .header {
        display: flex; justify-content: space-between; align-items: flex-start;
        flex-wrap: wrap; margin-bottom: 28px; padding: 20px 24px;
        background: linear-gradient(145deg, #141b26, #0f1620);
        border-radius: 20px; border: 1px solid #26303f;
    }
    .header-left h1 {
        font-size: 24px; font-weight: 700;
        background: linear-gradient(135deg, #f0c27f, #fc5c7d);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        letter-spacing: -0.5px;
    }
    .header-left .subtitle { font-size: 13px; color: #8899b0; margin-top: 6px; }
    .header-left .subtitle span {
        display: inline-block; background: #1f2a3a; padding: 2px 12px;
        border-radius: 12px; margin-right: 6px; margin-bottom: 4px;
    }
    .header-right { text-align: right; font-size: 13px; color: #8899b0; }
    .header-right .highlight { color: #f0c27f; }

    .kpi-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 14px; margin-bottom: 28px;
    }
    .kpi-card {
        background: #141b26; border-radius: 14px; padding: 14px 16px;
        border: 1px solid #1f2a3a; text-align: center;
    }
    .kpi-label { font-size: 11px; text-transform: uppercase; color: #7a8aa0; margin-bottom: 4px; }
    .kpi-value { font-size: 22px; font-weight: 700; }
    .kpi-value.positive { color: #4cd9a0; }
    .kpi-value.negative { color: #fc6b6b; }
    .kpi-value.neutral  { color: #f0c27f; }

    .chart-grid {
        display: grid; grid-template-columns: 1fr 1fr;
        gap: 20px; margin-bottom: 28px;
    }
    .chart-box {
        background: #141b26; border-radius: 16px; padding: 18px 18px 10px;
        border: 1px solid #1f2a3a;
    }
    .chart-box.full { grid-column: 1 / -1; }
    .chart-box .chart-title {
        font-size: 15px; font-weight: 600; color: #c8d8e8;
        margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
    }
    .chart-box .chart-title .badge {
        font-size: 10px; background: #1f2a3a; padding: 2px 12px;
        border-radius: 12px; color: #8899b0; font-weight: 400;
    }
    .chart-wrapper { position: relative; height: 260px; }
    .chart-wrapper.tall { height: 340px; }

    .table-wrap { overflow-x: auto; margin-top: 6px; }
    .table-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table-wrap th {
        text-align: left; padding: 8px 10px; color: #7a8aa0;
        font-weight: 500; font-size: 11px; text-transform: uppercase;
        border-bottom: 1px solid #1f2a3a;
    }
    .table-wrap td {
        padding: 7px 10px; border-bottom: 1px solid #1a222f; color: #d0dcec;
    }
    .table-wrap .num { font-family: 'JetBrains Mono', monospace; text-align: right; }
    .table-wrap .pos { color: #4cd9a0; }
    .table-wrap .neg { color: #fc6b6b; }

    .legend-inline {
        display: flex; gap: 18px; flex-wrap: wrap;
        margin-top: 8px; font-size: 12px; color: #8899b0;
    }
    .legend-inline .dot {
        display: inline-block; width: 10px; height: 10px;
        border-radius: 3px; margin-right: 6px;
    }
    .text-muted { color: #5a6a80; font-size: 12px; }
    .flex-between {
        display: flex; justify-content: space-between;
        align-items: center; flex-wrap: wrap;
    }
    .hidden { display: none !important; }

    @media (max-width: 900px) {
        .chart-grid { grid-template-columns: 1fr; }
        .header { flex-direction: column; gap: 10px; }
        .header-right { text-align: left; width: 100%; }
        .kpi-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 600px) {
        .kpi-grid { grid-template-columns: repeat(2, 1fr); }
        body { padding: 12px; }
    }
</style>
</head>
<body>

<div class="container">
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>正在加载策略数据 ...</div>
    </div>

    <div id="dashboard" class="hidden">
        <header class="header">
            <div class="header-left">
                <h1>🌍 MABS 全球多资产等权策略</h1>
                <div class="subtitle">
                    <span>5 只 ETF 等权</span>
                    <span>📅 季度再平衡</span>
                    <span id="dateRange"></span>
                </div>
            </div>
            <div class="header-right">
                <div>基准：<span class="highlight">等权买入持有</span></div>
                <div style="font-size:12px;color:#5a6a80;">数据来自 CSV · 自动渲染</div>
            </div>
        </header>

        <div class="kpi-grid" id="kpiGrid"></div>

        <div class="chart-grid">
            <div class="chart-box full">
                <div class="chart-title">📈 策略净值 vs 等权基准 <span class="badge">起点归一</span></div>
                <div class="chart-wrapper tall"><canvas id="navChart"></canvas></div>
                <div class="legend-inline">
                    <span><span class="dot" style="background:#f0c27f;"></span>策略净值</span>
                    <span><span class="dot" style="background:#4a90d9;"></span>等权基准（买入持有）</span>
                </div>
            </div>
        </div>

        <div class="chart-grid">
            <div class="chart-box">
                <div class="chart-title">📊 年度收益率</div>
                <div class="chart-wrapper"><canvas id="annualBarChart"></canvas></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">📉 年度最大回撤</div>
                <div class="chart-wrapper"><canvas id="annualDrawdownChart"></canvas></div>
            </div>
        </div>

        <div class="chart-box full" style="margin-bottom:28px;">
            <div class="flex-between">
                <div class="chart-title">📋 年度业绩明细</div>
                <span class="text-muted">交易日数 · 风险调整指标</span>
            </div>
            <div class="table-wrap" id="annualTableWrap"></div>
        </div>

        <div class="chart-box full">
            <div class="chart-title">
                🧩 各 ETF 仓位配比
                <span class="badge">虚线 = 目标仓位 20% · 竖线 = 再平衡</span>
            </div>
            <div class="chart-wrapper tall"><canvas id="holdingChart"></canvas></div>
            <div class="legend-inline" id="holdingLegend"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 配置：ETF 列表与颜色
// ============================================================
const ETF_LIST = [
    { code: '518880.SH', name: '黄金ETF',   color: '#f0c27f' },
    { code: '159920.SZ', name: '恒生ETF',   color: '#4a90d9' },
    { code: '159941.SZ', name: '纳指ETF',   color: '#a87fd9' },
    { code: '513030.SH', name: '德国ETF',   color: '#4cd9a0' },
    { code: '513500.SH', name: '标普500ETF', color: '#fc5c7d' },
];
const N_ETF = ETF_LIST.length;
const TARGET_PCT = 100 / N_ETF;  // 等权目标仓位

// ============================================================
// 工具：解析 CSV（保留日期字符串，只把真正的数字转数值）
// ============================================================
function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
    if (lines.length === 0) return [];
    const headers = lines[0].split(',').map(h => h.trim());
    const data = [];
    for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split(',').map(v => v.trim());
        if (values.length < headers.length) continue;
        const row = {};
        headers.forEach((h, idx) => {
            let val = values[idx] || '';
            // 仅当整串都是数字时转 float（避免 "2015-06-10" → 2015）
            if (/^-?\d+(\.\d+)?([eE][-+]?\d+)?$/.test(val)) val = parseFloat(val);
            row[h] = val;
        });
        data.push(row);
    }
    return data;
}

// ============================================================
// 工具：从净值序列计算整体指标
// ============================================================
function computeMetrics(navData) {
    const first = navData[0]['策略净值'];
    const last  = navData[navData.length - 1]['策略净值'];
    const totalReturn = last / first - 1;
    const nDays = navData.length - 1;
    const years = nDays / 252;
    const annualReturn = years > 0 ? Math.pow(1 + totalReturn, 1 / years) - 1 : 0;

    // 日收益率
    const rets = [];
    for (let i = 1; i < navData.length; i++) {
        const p0 = navData[i - 1]['策略净值'];
        const p1 = navData[i]['策略净值'];
        if (p0 > 0) rets.push(p1 / p0 - 1);
    }
    const mean = rets.reduce((a, b) => a + b, 0) / rets.length;
    const variance = rets.reduce((a, b) => a + (b - mean) ** 2, 0) / (rets.length - 1);
    const std = Math.sqrt(variance);
    const annualVol = std * Math.sqrt(252);

    const rf = 0.025;
    const sharpe = annualVol > 0 ? (annualReturn - rf) / annualVol : 0;

    // 最大回撤
    let peak = first, maxDD = 0;
    navData.forEach(d => {
        const v = d['策略净值'];
        if (v > peak) peak = v;
        const dd = (v - peak) / peak;
        if (dd < maxDD) maxDD = dd;
    });
    const calmar = maxDD !== 0 ? annualReturn / Math.abs(maxDD) : 0;

    return { totalReturn, annualReturn, annualVol, sharpe, maxDD, calmar };
}

// ============================================================
// 主流程：加载 CSV → 渲染看板
// ============================================================
const files = [
    'mabs_nav.csv',
    'mabs_annual_metrics.csv',
    'mabs_holding.csv'
];

let loadedData = {};

Promise.all(files.map(file =>
    fetch(file)
        .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status} — ${file}`);
            return res.text();
        })
        .then(text => {
            const key = file.replace('.csv', '');
            loadedData[key] = parseCSV(text);
        })
)).then(() => {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    renderDashboard(loadedData);
}).catch(err => {
    document.getElementById('loading').innerHTML = `
        <div style="color:#fc6b6b;font-size:20px;">⚠️ 数据加载失败</div>
        <div style="color:#8899b0;margin-top:12px;">${err.message}</div>
        <div style="color:#5a6a80;margin-top:8px;font-size:14px;">
            请确保以下 CSV 文件与当前 HTML 在同一目录：<br>
            mabs_nav.csv, mabs_annual_metrics.csv, mabs_holding.csv
        </div>
    `;
    console.error(err);
});

// ============================================================
// 渲染函数
// ============================================================
function renderDashboard(data) {
    const nav    = data['mabs_nav'] || [];
    const annual = data['mabs_annual_metrics'] || [];
    const holding = data['mabs_holding'] || [];

    if (!nav.length || !annual.length || !holding.length) {
        alert('关键数据为空，请检查 CSV 文件内容');
        return;
    }

    // ---- 日期范围 ----
    const firstDate = nav[0].date;
    const lastDate  = nav[nav.length - 1].date;
    document.getElementById('dateRange').textContent = `${firstDate}  ~  ${lastDate}`;

    // ---- KPI 卡片（从净值序列计算）----
    const m = computeMetrics(nav);
    const kpiConfig = [
        { label: '总收益率',   value: m.totalReturn,  fmt: v => (v * 100).toFixed(1) + '%', cls: m.totalReturn >= 0 ? 'positive' : 'negative' },
        { label: '年化收益率', value: m.annualReturn, fmt: v => (v * 100).toFixed(1) + '%', cls: m.annualReturn >= 0 ? 'positive' : 'negative' },
        { label: '年化波动率', value: m.annualVol,    fmt: v => (v * 100).toFixed(1) + '%', cls: 'neutral' },
        { label: '夏普比率',   value: m.sharpe,       fmt: v => v.toFixed(2),               cls: m.sharpe >= 0 ? 'positive' : 'negative' },
        { label: '最大回撤',   value: m.maxDD,        fmt: v => (v * 100).toFixed(1) + '%', cls: 'negative' },
        { label: 'Calmar比率', value: m.calmar,       fmt: v => v.toFixed(2),               cls: m.calmar >= 0 ? 'positive' : 'negative' },
    ];
    const kpiGrid = document.getElementById('kpiGrid');
    kpiGrid.innerHTML = '';
    kpiConfig.forEach(item => {
        const div = document.createElement('div');
        div.className = 'kpi-card';
        div.innerHTML = `
            <div class="kpi-label">${item.label}</div>
            <div class="kpi-value ${item.cls}">${item.fmt(item.value)}</div>
        `;
        kpiGrid.appendChild(div);
    });

    // ---- 净值曲线图 ----
    const dates    = nav.map(d => d.date);
    const strategy = nav.map(d => d['策略净值']);
    const bench    = nav.map(d => d['等权基准净值']);

    const navCtx = document.getElementById('navChart').getContext('2d');
    if (window._navChart) window._navChart.destroy();
    window._navChart = new Chart(navCtx, {
        type: 'line',
        data: {
            labels: dates,
            datasets: [
                {
                    label: '策略净值',
                    data: strategy,
                    borderColor: '#f0c27f',
                    backgroundColor: 'rgba(240,194,127,0.10)',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.1,
                    fill: true
                },
                {
                    label: '等权基准',
                    data: bench,
                    borderColor: '#4a90d9',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.1,
                    borderDash: [5, 4],
                    fill: false
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('en-US', {maximumFractionDigits: 0})}`
                    }
                }
            },
            scales: {
                x: {
                    ticks: { maxTicksLimit: 20, color: '#8899b0', autoSkip: true },
                    grid: { color: '#1a222f' }
                },
                y: {
                    ticks: {
                        color: '#8899b0',
                        callback: v => (v / 10000).toFixed(0) + '万'
                    },
                    grid: { color: '#1a222f' }
                }
            }
        }
    });

    // ---- 年度收益率柱状图 ----
    const years = annual.map(r => String(r['年份']));
    const retValues = annual.map(r => r['总收益率'] * 100);

    const barCtx = document.getElementById('annualBarChart').getContext('2d');
    if (window._barChart) window._barChart.destroy();
    window._barChart = new Chart(barCtx, {
        type: 'bar',
        data: {
            labels: years,
            datasets: [{
                label: '年度收益率 (%)',
                data: retValues,
                backgroundColor: retValues.map(v => v >= 0 ? 'rgba(76,217,160,0.7)' : 'rgba(252,107,107,0.7)'),
                borderColor: retValues.map(v => v >= 0 ? '#4cd9a0' : '#fc6b6b'),
                borderWidth: 1.5
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { ticks: { callback: v => v.toFixed(0) + '%', color: '#8899b0' }, grid: { color: '#1a222f' } },
                x: { ticks: { color: '#8899b0' }, grid: { display: false } }
            }
        }
    });

    // ---- 年度最大回撤柱状图 ----
    const ddValues = annual.map(r => r['最大回撤'] * 100);

    const ddCtx = document.getElementById('annualDrawdownChart').getContext('2d');
    if (window._ddChart) window._ddChart.destroy();
    window._ddChart = new Chart(ddCtx, {
        type: 'bar',
        data: {
            labels: years,
            datasets: [{
                label: '最大回撤 (%)',
                data: ddValues,
                backgroundColor: 'rgba(252,107,107,0.6)',
                borderColor: '#fc6b6b',
                borderWidth: 1.5
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { ticks: { callback: v => v.toFixed(0) + '%', color: '#8899b0' }, grid: { color: '#1a222f' } },
                x: { ticks: { color: '#8899b0' }, grid: { display: false } }
            }
        }
    });

    // ---- 年度表格 ----
    const tableWrap = document.getElementById('annualTableWrap');
    let tableHtml = `<table>
        <thead><tr>
            <th>年份</th><th>总收益率</th><th>年化收益率</th><th>年化波动率</th>
            <th>夏普比率</th><th>最大回撤</th><th>Calmar</th><th>交易日</th>
        </tr></thead><tbody>`;
    annual.forEach(row => {
        const yr     = row['年份'];
        const totalR = row['总收益率'];
        const annR   = row['年化收益率'];
        const annV   = row['年化波动率'];
        const sh     = row['夏普比率'];
        const mdd    = row['最大回撤'];
        const cal    = row['Calmar比率'];
        const days   = row['交易日数'];
        tableHtml += `<tr>
            <td>${yr}</td>
            <td class="num ${totalR >= 0 ? 'pos' : 'neg'}">${(totalR * 100).toFixed(1)}%</td>
            <td class="num ${annR >= 0 ? 'pos' : 'neg'}">${(annR * 100).toFixed(1)}%</td>
            <td class="num">${(annV * 100).toFixed(1)}%</td>
            <td class="num">${sh.toFixed(2)}</td>
            <td class="num neg">${(mdd * 100).toFixed(1)}%</td>
            <td class="num">${cal.toFixed(2)}</td>
            <td class="num">${days}</td>
        </tr>`;
    });
    tableHtml += '</tbody></table>';
    tableWrap.innerHTML = tableHtml;

    // ---- 仓位配比图 ----
    const hDates = holding.map(d => d.date);

    // 每只 ETF 的仓位百分比
    const etfPctSeries = ETF_LIST.map(e => {
        return holding.map(d => {
            const total = d['total_value'] || 0;
            const v = d[e.code + '_value'] || 0;
            return total > 0 ? (v / total) * 100 : 0;
        });
    });

    // 检测再平衡日期：任意 ETF 仓位单日跳变 > 3%
    const rebalanceDates = [];
    for (let i = 1; i < holding.length; i++) {
        let maxChange = 0;
        ETF_LIST.forEach((e, k) => {
            const prev = etfPctSeries[k][i - 1];
            const curr = etfPctSeries[k][i];
            maxChange = Math.max(maxChange, Math.abs(curr - prev));
        });
        if (maxChange > 3) rebalanceDates.push(hDates[i]);
    }

    // 自定义插件：在再平衡日画竖虚线
    const rebalancePlugin = {
        id: 'rebalanceLines',
        afterDatasetsDraw(chart) {
            const { ctx, chartArea, scales } = chart;
            if (!rebalanceDates.length || !chartArea) return;
            const xScale = scales.x;
            ctx.save();
            ctx.strokeStyle = 'rgba(240, 194, 127, 0.35)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            rebalanceDates.forEach(date => {
                const idx = hDates.indexOf(date);
                if (idx === -1) return;
                const x = xScale.getPixelForValue(idx);
                if (x < chartArea.left || x > chartArea.right) return;
                ctx.beginPath();
                ctx.moveTo(x, chartArea.top);
                ctx.lineTo(x, chartArea.bottom);
                ctx.stroke();
            });
            ctx.restore();
        }
    };

    // 数据集：每只 ETF 一条线 + 一条目标线
    const datasets = ETF_LIST.map((e, k) => ({
        label: e.name + ' %',
        data: etfPctSeries[k],
        borderColor: e.color,
        backgroundColor: 'transparent',
        borderWidth: 1.8,
        pointRadius: 0,
        tension: 0.15,
        fill: false
    }));
    // 目标 20% 虚线
    datasets.push({
        label: `等权目标 ${TARGET_PCT.toFixed(0)}%`,
        data: hDates.map(() => TARGET_PCT),
        borderColor: 'rgba(200,216,232,0.45)',
        borderWidth: 1.2,
        borderDash: [6, 5],
        pointRadius: 0,
        fill: false
    });

    const holdCtx = document.getElementById('holdingChart').getContext('2d');
    if (window._holdChart) window._holdChart.destroy();
    window._holdChart = new Chart(holdCtx, {
        type: 'line',
        data: { labels: hDates, datasets: datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}%`
                    }
                }
            },
            scales: {
                x: {
                    ticks: { maxTicksLimit: 18, color: '#8899b0', autoSkip: true },
                    grid: { color: '#1a222f' }
                },
                y: {
                    min: 0,
                    max: 50,
                    ticks: { callback: v => v + '%', color: '#8899b0' },
                    grid: { color: '#1a222f' },
                    title: { display: true, text: '仓位占比 (%)', color: '#8899b0' }
                }
            }
        },
        plugins: [rebalancePlugin]
    });

    // ---- 图例（动态生成）----
    const legendWrap = document.getElementById('holdingLegend');
    legendWrap.innerHTML = '';
    ETF_LIST.forEach(e => {
        const span = document.createElement('span');
        span.innerHTML = `<span class="dot" style="background:${e.color};"></span>${e.name}`;
        legendWrap.appendChild(span);
    });
    const targetSpan = document.createElement('span');
    targetSpan.innerHTML = `<span class="dot" style="background:rgba(200,216,232,0.6);"></span>等权目标 ${TARGET_PCT.toFixed(0)}%`;
    legendWrap.appendChild(targetSpan);
    const rbSpan = document.createElement('span');
    rbSpan.innerHTML = `<span class="dot" style="background:rgba(240,194,127,0.6);"></span>再平衡日（竖线）`;
    legendWrap.appendChild(rbSpan);
}
</script>
