<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高股息质量龙头轮动策略 · 季度调仓</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e17; color: #e6edf5; padding: 24px; min-height: 100vh;
        }
        .container { max-width: 1440px; margin: 0 auto; }

        .loading { text-align: center; padding: 80px 20px; color: #5a6a80; font-size: 18px; }
        .loading .spinner {
            display: inline-block; width: 40px; height: 40px;
            border: 4px solid #1f2a3a; border-top-color: #f0c27f;
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .header {
            display: flex; justify-content: space-between; align-items: flex-start;
            flex-wrap: wrap; margin-bottom: 28px; padding: 20px 24px;
            background: linear-gradient(145deg, #141b26, #0f1620);
            border-radius: 20px; border: 1px solid #26303f;
        }
        .header-left h1 {
            font-size: 24px; font-weight: 700;
            background: linear-gradient(135deg, #f0c27f, #fc5c7d);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .header-left .subtitle { font-size: 13px; color: #8899b0; margin-top: 4px; }
        .header-left .subtitle span {
            display: inline-block; background: #1f2a3a; padding: 0 12px;
            border-radius: 12px; margin-right: 6px;
        }
        .header-right { text-align: right; font-size: 13px; color: #8899b0; }
        .header-right .highlight { color: #f0c27f; }

        .kpi-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px; margin-bottom: 28px;
        }
        .kpi-card {
            background: #141b26; border-radius: 14px; padding: 14px 16px;
            border: 1px solid #1f2a3a; text-align: center;
        }
        .kpi-label { font-size: 11px; text-transform: uppercase; color: #7a8aa0; margin-bottom: 4px; }
        .kpi-value { font-size: 22px; font-weight: 700; }
        .kpi-value.positive { color: #4cd9a0; }
        .kpi-value.negative { color: #fc6b6b; }
        .kpi-value.neutral  { color: #f0c27f; }

        .chart-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px;
        }
        .chart-box {
            background: #141b26; border-radius: 16px; padding: 18px 18px 10px;
            border: 1px solid #1f2a3a;
        }
        .chart-box.full { grid-column: 1 / -1; }
        .chart-box .chart-title {
            font-size: 15px; font-weight: 600; color: #c8d8e8;
            margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
        }
        .chart-box .chart-title .badge {
            font-size: 10px; background: #1f2a3a; padding: 1px 12px;
            border-radius: 12px; color: #8899b0; font-weight: 400;
        }
        .chart-wrapper { position: relative; height: 260px; }
        .chart-wrapper.tall { height: 420px; }
        .chart-wrapper.mid  { height: 360px; }

        .table-wrap { overflow-x: auto; margin-top: 6px; }
        .table-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .table-wrap th {
            text-align: left; padding: 8px 10px; color: #7a8aa0; font-weight: 500;
            font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #1f2a3a;
            position: sticky; top: 0; background: #141b26;
        }
        .table-wrap td {
            padding: 7px 10px; border-bottom: 1px solid #1a222f; color: #d0dcec;
        }
        .table-wrap .num { font-family: 'JetBrains Mono', monospace; text-align: right; }
        .table-wrap .pos { color: #4cd9a0; }
        .table-wrap .neg { color: #fc6b6b; }
        .table-wrap tr.selected-row { background: rgba(240,194,127,0.06); }
        .table-wrap tr:hover { background: rgba(255,255,255,0.03); }
        .table-wrap .star { color: #fc5c7d; font-weight: 700; }
        .table-wrap .code { font-family: 'JetBrains Mono', monospace; color: #f0c27f; }

        .legend-inline {
            display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px;
            font-size: 12px; color: #8899b0;
        }
        .legend-inline .dot {
            display: inline-block; width: 10px; height: 10px;
            border-radius: 3px; margin-right: 6px;
        }

        .hold-legend {
            display: flex; flex-wrap: wrap; gap: 8px 16px;
            margin-top: 12px; font-size: 12px; color: #b8c9dd;
        }
        .hold-legend .lg-item {
            display: inline-flex; align-items: center; gap: 6px;
            background: #1a2332; padding: 3px 10px; border-radius: 12px;
            border: 1px solid #26303f;
        }
        .hold-legend .swatch {
            display: inline-block; width: 10px; height: 10px;
            border-radius: 3px;
        }

        .text-muted { color: #5a6a80; font-size: 12px; }
        .flex-between {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
        }
        .hidden { display: none !important; }

        .debug-bar {
            margin-top: 8px; padding: 8px 12px;
            background: #0f1620; border: 1px dashed #26303f;
            border-radius: 8px; font-size: 11px; color: #5a6a80;
            font-family: 'JetBrains Mono', monospace;
        }

        .factor-table-wrap {
            max-height: 520px; overflow-y: auto;
            border-radius: 10px; border: 1px solid #1f2a3a;
        }

        @media (max-width: 900px) {
            .chart-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 10px; }
            .header-right { text-align: left; width: 100%; }
            .kpi-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 600px) {
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            body { padding: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>正在加载 DRLR 策略数据 ...</div>
    </div>

    <div id="dashboard" class="hidden">
        <header class="header">
            <div class="header-left">
                <h1>💎 高股息质量龙头轮动策略</h1>
                <div class="subtitle">
                    <span>Dividend × ROE</span>
                    <span>📅 季度调仓</span>
                    <span id="dateRange"></span>
                </div>
            </div>
            <div class="header-right">
                <div>因子：<span class="highlight">股息率 × ROE</span> · 等权配置 Top 4</div>
                <div id="latestFactorDate" style="margin-top:4px;"></div>
            </div>
        </header>

        <div class="kpi-grid" id="kpiGrid"></div>

        <!-- 净值曲线 -->
        <div class="chart-grid">
            <div class="chart-box full">
                <div class="chart-title">📈 策略净值 vs 等权基准净值 <span class="badge">调仓点 ▲</span></div>
                <div class="chart-wrapper tall"><canvas id="navChart"></canvas></div>
                <div class="legend-inline">
                    <span><span class="dot" style="background:#f0c27f;"></span>DRLR 策略净值</span>
                    <span><span class="dot" style="background:#8899b0;"></span>等权基准净值</span>
                    <span><span class="dot" style="background:#fc5c7d;"></span>调仓点</span>
                </div>
            </div>
        </div>

        <!-- 年度收益率 / 最大回撤 -->
        <div class="chart-grid">
            <div class="chart-box">
                <div class="chart-title">📊 年度收益率</div>
                <div class="chart-wrapper"><canvas id="annualBarChart"></canvas></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">📉 年度最大回撤</div>
                <div class="chart-wrapper"><canvas id="annualDrawdownChart"></canvas></div>
            </div>
        </div>

        <!-- 年度业绩表 -->
        <div class="chart-box full" style="margin-bottom:28px;">
            <div class="flex-between">
                <div class="chart-title">📋 年度业绩明细</div>
                <span class="text-muted">交易日数 · 风险调整指标</span>
            </div>
            <div class="table-wrap" id="annualTableWrap"></div>
        </div>

        <!-- 最新因子快照 + 横截面 -->
        <div class="chart-grid">
            <div class="chart-box">
                <div class="chart-title">
                    📌 最新因子快照
                    <span class="badge">红 = 本期入选</span>
                </div>
                <div class="factor-table-wrap">
                    <div class="table-wrap" id="factorLatestTableWrap"></div>
                </div>
            </div>
            <div class="chart-box">
                <div class="chart-title">
                    🎯 最新因子横截面
                    <span class="badge">红=入选 蓝=未入选</span>
                </div>
                <div class="chart-wrapper mid"><canvas id="factorBarChart"></canvas></div>
            </div>
        </div>

        <!-- 因子时序 -->
        <div class="chart-box full" style="margin-bottom:28px;">
            <div class="chart-title">
                ⏱️ 因子时序（dividend_yield × roe）
                <span class="badge">每只股票一条线</span>
            </div>
            <div class="chart-wrapper tall"><canvas id="factorTsChart"></canvas></div>
            <div class="hold-legend" id="factorLegend"></div>
        </div>

        <!-- 每日持仓明细 -->
        <div class="chart-box full">
            <div class="chart-title">
                🧩 每日持仓明细（股票 + 现金，单位：元）
                <span class="badge">竖线 = 季度调仓</span>
            </div>
            <div class="chart-wrapper tall"><canvas id="holdingChart"></canvas></div>
            <div class="hold-legend" id="holdingLegend"></div>
            <div class="debug-bar" id="holdingDebug"></div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // ★ 补齐股票代码到 6 位
    // ============================================================
    function padCode(code) {
        if (code === undefined || code === null || code === '') return '';
        // 去掉可能的 .SH/.SZ 后缀或小数点
        let s = String(code).trim();
        // 若含有 '.0'（被 parseFloat 转成 2532.0），先去掉
        s = s.replace(/\.0+$/, '');
        // 只保留数字部分
        s = s.replace(/[^0-9]/g, '');
        return s.padStart(6, '0');
    }

    // ============================================================
    // CSV 解析（去 BOM）★ stock_code 保持字符串
    // ============================================================
    function parseCSV(text) {
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length === 0) return [];
        const headers = lines[0].split(',').map(h => h.trim());

        // 需要保持字符串的列（股票代码、日期等）
        const stringCols = new Set(['stock_code', 'code', 'date', 'name', 'industry']);

        const data = [];
        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].split(',').map(v => v.trim());
            if (values.length < headers.length) continue;
            const row = {};
            headers.forEach((h, idx) => {
                let val = values[idx] || '';

                if (stringCols.has(h)) {
                    // 字符串列：保持原样
                    row[h] = val;
                } else {
                    // 数值列：尝试转数字
                    if (!isNaN(val) && val !== '') {
                        val = parseFloat(val);
                    }
                    row[h] = val;
                }
            });
            data.push(row);
        }
        return data;
    }

    // ============================================================
    // 加载 6 个 CSV 文件
    // ============================================================
    const files = [
        'DRLR_metrics.csv',
        'DRLR_nav.csv',
        'DRLR_annual_metrics.csv',
        'DRLR_holding.csv',
        'DRLR_factor_latest.csv',
        'DRLR_factor_history.csv'
    ];

    let loadedData = {};

    Promise.all(files.map(file =>
        fetch(file)
        .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status} — ${file}`);
            return res.text();
        })
        .then(text => {
            const key = file.replace('.csv', '');
            loadedData[key] = parseCSV(text);
        })
        .catch(err => {
            console.warn(`跳过 ${file}: ${err.message}`);
            loadedData[file.replace('.csv', '')] = [];
        })
    )).then(() => {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        renderDashboard(loadedData);
    }).catch(err => {
        document.getElementById('loading').innerHTML = `
            <div style="color:#fc6b6b;font-size:20px;">⚠️ 数据加载失败</div>
            <div style="color:#8899b0;margin-top:12px;">${err.message}</div>
        `;
        console.error(err);
    });

    // ============================================================
    // HSL 颜色生成
    // ============================================================
    function hslColor(i, total, alpha = 0.85) {
        const hue = Math.round((i * 360) / Math.max(total, 1));
        return `hsla(${hue}, 65%, 60%, ${alpha})`;
    }

    // ============================================================
    // 格式化
    // ============================================================
    function fmtNum(v, digits = 4) {
        if (v === undefined || v === null || isNaN(v)) return '--';
        return Number(v).toFixed(digits);
    }

    // ============================================================
    // 渲染看板
    // ============================================================
    function renderDashboard(data) {
        const metrics       = data['DRLR_metrics'];
        const nav           = data['DRLR_nav'];
        const annual        = data['DRLR_annual_metrics'];
        const holding       = data['DRLR_holding'];
        const factorLatest  = data['DRLR_factor_latest'];
        const factorHistory = data['DRLR_factor_history'];

        if (!nav || !nav.length || !metrics || !metrics.length) {
            alert('关键数据为空，请检查 CSV 文件内容');
            return;
        }

        // ---- 日期范围 ----
        const first = nav[0].date;
        const last  = nav[nav.length - 1].date;
        document.getElementById('dateRange').textContent = `${first}  ~  ${last}`;

        // ---- KPI ----
        const kpiMap = {};
        metrics.forEach(row => { kpiMap[row['指标']] = row['数值']; });
        const kpiConfig = [
            { label: '总收益率',   key: '总收益率',   fmt: v => (v * 100).toFixed(1) + '%' },
            { label: '年化收益率', key: '年化收益率', fmt: v => (v * 100).toFixed(1) + '%' },
            { label: '年化波动率', key: '年化波动率', fmt: v => (v * 100).toFixed(1) + '%' },
            { label: '夏普比率',   key: '夏普比率',   fmt: v => v.toFixed(2) },
            { label: '最大回撤',   key: '最大回撤',   fmt: v => (v * 100).toFixed(1) + '%' },
            { label: 'Calmar比率', key: 'Calmar比率', fmt: v => v.toFixed(2) },
        ];
        const kpiGrid = document.getElementById('kpiGrid');
        kpiGrid.innerHTML = '';
        kpiConfig.forEach(item => {
            const val = kpiMap[item.key];
            let cls = 'neutral';
            if (val !== undefined) {
                if (item.key === '最大回撤') {
                    cls = (val < 0) ? 'negative' : 'positive';
                } else if (['总收益率', '年化收益率', '夏普比率', 'Calmar比率'].includes(item.key)) {
                    cls = (val > 0) ? 'positive' : 'negative';
                }
            }
            const div = document.createElement('div');
            div.className = 'kpi-card';
            div.innerHTML = `
                <div class="kpi-label">${item.label}</div>
                <div class="kpi-value ${cls}">${val !== undefined ? item.fmt(val) : '--'}</div>
            `;
            kpiGrid.appendChild(div);
        });

        // ---- 净值图 ----
        const dates     = nav.map(d => d.date);
        const strategy  = nav.map(d => d['策略净值']);
        const benchmark = nav.map(d => d['基准净值']);

        const rebalanceDates = [];
        if (holding && holding.length > 1) {
            for (let i = 1; i < holding.length; i++) {
                const prevCash = holding[i - 1].cash || 0;
                const currCash = holding[i].cash || 0;
                if (Math.abs(currCash - prevCash) > 1.0) {
                    rebalanceDates.push(holding[i].date);
                }
            }
        }

        const rebalanceMarkersPlugin = {
            id: 'rebalanceMarkers',
            afterDatasetsDraw(chart) {
                const { ctx, chartArea, scales } = chart;
                if (!rebalanceDates.length || !chartArea) return;
                const xScale = scales.x;
                const navMap = {};
                nav.forEach((d, i) => { navMap[d.date] = i; });
                ctx.save();
                ctx.fillStyle = '#fc5c7d';
                rebalanceDates.forEach(date => {
                    const idx = navMap[date];
                    if (idx === undefined) return;
                    const meta = chart.getDatasetMeta(0).data[idx];
                    if (!meta) return;
                    const x = xScale.getPixelForValue(idx);
                    const y = meta.y;
                    if (x < chartArea.left || x > chartArea.right) return;
                    ctx.beginPath();
                    ctx.moveTo(x, y - 8);
                    ctx.lineTo(x - 5, y + 4);
                    ctx.lineTo(x + 5, y + 4);
                    ctx.closePath();
                    ctx.fill();
                });
                ctx.restore();
            }
        };

        const navCtx = document.getElementById('navChart').getContext('2d');
        if (window._navChart) window._navChart.destroy();
        window._navChart = new Chart(navCtx, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [
                    {
                        label: 'DRLR 策略净值',
                        data: strategy,
                        borderColor: '#f0c27f',
                        backgroundColor: 'rgba(240,194,127,0.10)',
                        borderWidth: 2, pointRadius: 0, tension: 0.1, fill: true
                    },
                    {
                        label: '等权基准净值',
                        data: benchmark,
                        borderColor: '#8899b0',
                        borderWidth: 1.5, pointRadius: 0, tension: 0.1, borderDash: [4, 4]
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { maxTicksLimit: 20, color: '#8899b0' }, grid: { color: '#1a222f' } },
                    y: { ticks: { color: '#8899b0' }, grid: { color: '#1a222f' } }
                }
            },
            plugins: [rebalanceMarkersPlugin]
        });

        // ---- 年度收益率 & 最大回撤 ----
        const annualMap = {};
        annual.forEach(row => {
            annualMap[row['年份']] = {
                return:   row['总收益率'],
                drawdown: row['最大回撤']
            };
        });
        const years     = Object.keys(annualMap).sort();
        const retValues = years.map(y => annualMap[y].return * 100);
        const ddValues  = years.map(y => annualMap[y].drawdown * 100);

        const barCtx = document.getElementById('annualBarChart').getContext('2d');
        if (window._barChart) window._barChart.destroy();
        window._barChart = new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: years,
                datasets: [{
                    label: '年度收益率 (%)',
                    data: retValues,
                    backgroundColor: retValues.map(v => v >= 0
                        ? 'rgba(76,217,160,0.7)' : 'rgba(252,107,107,0.7)'),
                    borderColor: retValues.map(v => v >= 0
                        ? '#4cd9a0' : '#fc6b6b'),
                    borderWidth: 1.5
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { ticks: { callback: v => v + '%', color: '#8899b0' }, grid: { color: '#1a222f' } },
                    x: { ticks: { color: '#8899b0' }, grid: { display: false } }
                }
            }
        });

        const ddCtx = document.getElementById('annualDrawdownChart').getContext('2d');
        if (window._ddChart) window._ddChart.destroy();
        window._ddChart = new Chart(ddCtx, {
            type: 'bar',
            data: {
                labels: years,
                datasets: [{
                    label: '最大回撤 (%)',
                    data: ddValues,
                    backgroundColor: 'rgba(252,107,107,0.6)',
                    borderColor: '#fc6b6b',
                    borderWidth: 1.5
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { ticks: { callback: v => v + '%', color: '#8899b0' }, grid: { color: '#1a222f' } },
                    x: { ticks: { color: '#8899b0' }, grid: { display: false } }
                }
            }
        });

        // ---- 年度业绩表 ----
        const tableWrap = document.getElementById('annualTableWrap');
        let tableHtml = `<table>
            <thead><tr>
                <th>年份</th><th>总收益率</th><th>年化收益率</th><th>年化波动率</th>
                <th>夏普比率</th><th>最大回撤</th><th>Calmar</th><th>交易日</th>
            </tr></thead><tbody>`;
        annual.forEach(row => {
            const yr       = row['年份'];
            const totalRet = row['总收益率'];
            const annRet   = row['年化收益率'];
            const annVol   = row['年化波动率'];
            const sharpe   = row['夏普比率'];
            const mdd      = row['最大回撤'];
            const calmar   = row['Calmar比率'];
            const days     = row['交易日数'];
            tableHtml += `<tr>
                <td>${yr}</td>
                <td class="num ${totalRet >= 0 ? 'pos' : 'neg'}">${(totalRet * 100).toFixed(1)}%</td>
                <td class="num ${annRet >= 0 ? 'pos' : 'neg'}">${(annRet * 100).toFixed(1)}%</td>
                <td class="num">${(annVol * 100).toFixed(1)}%</td>
                <td class="num">${sharpe.toFixed(2)}</td>
                <td class="num neg">${(mdd * 100).toFixed(1)}%</td>
                <td class="num">${calmar.toFixed(2)}</td>
                <td class="num">${days}</td>
            </tr>`;
        });
        tableHtml += '</tbody></table>';
        tableWrap.innerHTML = tableHtml;

        // =====================================================
        // 最新因子快照 表
        // =====================================================
        if (factorLatest && factorLatest.length) {
            const latestDate = factorLatest[0].date || (rebalanceDates.length ? rebalanceDates[rebalanceDates.length - 1] : '');
            document.getElementById('latestFactorDate').textContent = latestDate ? `因子日期：${latestDate}` : '';

            const rows = [...factorLatest].sort((a, b) => {
                if ((b.selected || 0) !== (a.selected || 0)) {
                    return (b.selected || 0) - (a.selected || 0);
                }
                return (b.factor || 0) - (a.factor || 0);
            });

            let fHtml = `<table>
                <thead><tr>
                    <th>代码</th><th>名称</th><th>行业</th>
                    <th class="num">股息率</th>
                    <th class="num">ROE</th>
                    <th class="num">因子值</th>
                    <th>入选</th>
                </tr></thead><tbody>`;
            rows.forEach(r => {
                const selected = r.selected == 1;
                const code = padCode(r.stock_code);
                fHtml += `<tr class="${selected ? 'selected-row' : ''}">
                    <td class="code">${code}</td>
                    <td>${r.name || ''}</td>
                    <td>${r.industry || ''}</td>
                    <td class="num">${fmtNum(r.dividend_yield, 6)}</td>
                    <td class="num">${fmtNum(r.roe, 4)}</td>
                    <td class="num">${fmtNum(r.factor, 6)}</td>
                    <td>${selected ? '<span class="star">★</span>' : ''}</td>
                </tr>`;
            });
            fHtml += '</tbody></table>';
            document.getElementById('factorLatestTableWrap').innerHTML = fHtml;
        } else {
            document.getElementById('factorLatestTableWrap').innerHTML =
                `<div class="text-muted" style="padding:20px;">未加载到 DRLR_factor_latest.csv</div>`;
        }

        // =====================================================
        // 最新因子横截面柱状图
        // =====================================================
        if (factorLatest && factorLatest.length) {
            const sorted = [...factorLatest].sort((a, b) => (a.factor || 0) - (b.factor || 0));
            const labels = sorted.map(r => `${r.name || padCode(r.stock_code)}`);
            const values = sorted.map(r => r.factor || 0);
            const colors = sorted.map(r => r.selected == 1
                ? 'rgba(252,92,125,0.85)'
                : 'rgba(74,144,217,0.75)');

            const fCtx = document.getElementById('factorBarChart').getContext('2d');
            if (window._factorBarChart) window._factorBarChart.destroy();
            window._factorBarChart = new Chart(fCtx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '因子值',
                        data: values,
                        backgroundColor: colors,
                        borderColor: colors,
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: function(items) {
                                    const idx = items[0].dataIndex;
                                    const r = sorted[idx];
                                    return `${padCode(r.stock_code)} ${r.name || ''}`;
                                },
                                label: function(ctx) {
                                    const idx = ctx.dataIndex;
                                    const r = sorted[idx];
                                    return [
                                        `因子值: ${(r.factor || 0).toFixed(6)}`,
                                        `股息率: ${(r.dividend_yield || 0).toFixed(6)}`,
                                        `ROE: ${(r.roe || 0).toFixed(4)}`
                                    ];
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#8899b0' },
                            grid: { color: '#1a222f' },
                            title: { display: true, text: '因子值 (dividend_yield × roe)', color: '#8899b0' }
                        },
                        y: {
                            ticks: { color: '#c8d8e8', font: { size: 10 } },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // =====================================================
        // 因子时序折线图
        // =====================================================
        if (factorHistory && factorHistory.length) {
            const byStock = {};
            factorHistory.forEach(r => {
                const code = padCode(r.stock_code);
                if (!code) return;
                if (!byStock[code]) {
                    byStock[code] = {
                        name: r.name || code,
                        industry: r.industry || '',
                        points: []
                    };
                }
                byStock[code].points.push({
                    date: r.date,
                    factor: r.factor || 0
                });
            });

            const stockCodes = Object.keys(byStock);
            const allRebalanceDates = [...new Set(factorHistory.map(r => r.date))].sort();

            stockCodes.forEach(code => {
                const dateMap = {};
                byStock[code].points.forEach(p => { dateMap[p.date] = p.factor; });
                byStock[code].dateMap = dateMap;
            });

            const stockColors = {};
            stockCodes.forEach((code, i) => {
                stockColors[code] = hslColor(i, stockCodes.length, 0.85);
            });

            const datasets = stockCodes.map(code => ({
                label: `${byStock[code].name}(${byStock[code].industry})`,
                data: allRebalanceDates.map(d => byStock[code].dateMap[d] !== undefined
                    ? byStock[code].dateMap[d] : null),
                borderColor: stockColors[code],
                backgroundColor: stockColors[code],
                borderWidth: 1.8,
                pointRadius: 3,
                pointHoverRadius: 5,
                tension: 0.15,
                spanGaps: true
            }));

            const tsCtx = document.getElementById('factorTsChart').getContext('2d');
            if (window._factorTsChart) window._factorTsChart.destroy();
            window._factorTsChart = new Chart(tsCtx, {
                type: 'line',
                data: {
                    labels: allRebalanceDates,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'nearest', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    if (ctx.parsed.y === null) return null;
                                    return `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(6)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                maxTicksLimit: 20,
                                color: '#8899b0',
                                callback: function(v, i) {
                                    const d = allRebalanceDates[i];
                                    return d ? String(d).slice(0, 7) : '';
                                }
                            },
                            grid: { color: '#1a222f' }
                        },
                        y: {
                            ticks: { color: '#8899b0' },
                            grid: { color: '#1a222f' },
                            title: { display: true, text: '因子值', color: '#8899b0' }
                        }
                    }
                }
            });

            const legendWrap = document.getElementById('factorLegend');
            legendWrap.innerHTML = '';
            stockCodes.forEach(code => {
                const item = document.createElement('span');
                item.className = 'lg-item';
                item.innerHTML = `
                    <span class="swatch" style="background:${stockColors[code]};"></span>
                    ${byStock[code].name}(${byStock[code].industry})
                `;
                legendWrap.appendChild(item);
            });
        } else {
            document.getElementById('factorTsChart').parentElement.innerHTML =
                `<div class="text-muted" style="padding:20px;">未加载到 DRLR_factor_history.csv</div>`;
        }

        // =====================================================
        // 每日持仓明细
        // =====================================================
        const debugBar = document.getElementById('holdingDebug');
        if (!holding || !holding.length) {
            debugBar.textContent = '⚠️ DRLR_holding.csv 没有数据';
            return;
        }

        const holdingDates = holding.map(d => d.date);

        const allStockCols = Object.keys(holding[0]).filter(k => k.includes('|'));
        const activeStocks = allStockCols.filter(col =>
            holding.some(h => (h[col] || 0) > 1)
        );

        debugBar.textContent =
            `调仓日 ${rebalanceDates.length} 个 · 历史出现过的股票 ${activeStocks.length} 只 · ` +
            `总交易日 ${holding.length} 天`;

        const stockColors = {};
        activeStocks.forEach((col, i) => {
            stockColors[col] = hslColor(i, activeStocks.length, 0.85);
        });

        const STACK_ID = 'portfolio';
        const datasets = [];

        datasets.push({
            label: '现金',
            data: holding.map(h => h.cash || 0),
            backgroundColor: 'rgba(136,153,176,0.55)',
            borderColor: 'rgba(136,153,176,0.9)',
            borderWidth: 0,
            pointRadius: 0,
            pointHoverRadius: 0,
            tension: 0.1,
            fill: true,
            stack: STACK_ID,
            order: 999
        });

        activeStocks.forEach(col => {
            const name = col.includes('|') ? col.split('|')[1] : col;
            datasets.push({
                label: name || col,
                data: holding.map(h => h[col] || 0),
                backgroundColor: stockColors[col],
                borderColor: stockColors[col],
                borderWidth: 0,
                pointRadius: 0,
                pointHoverRadius: 0,
                tension: 0.1,
                fill: true,
                stack: STACK_ID,
                order: 1
            });
        });

        const rebalanceLinesPlugin = {
            id: 'rebalanceLines',
            afterDatasetsDraw(chart) {
                const { ctx, chartArea, scales } = chart;
                if (!rebalanceDates.length || !chartArea) return;
                const xScale = scales.x;
                ctx.save();
                ctx.strokeStyle = 'rgba(240, 194, 127, 0.35)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                rebalanceDates.forEach(date => {
                    const idx = holdingDates.indexOf(date);
                    if (idx === -1) return;
                    const x = xScale.getPixelForValue(idx);
                    if (x < chartArea.left || x > chartArea.right) return;
                    ctx.beginPath();
                    ctx.moveTo(x, chartArea.top);
                    ctx.lineTo(x, chartArea.bottom);
                    ctx.stroke();
                });
                ctx.restore();
            }
        };

        const holdCtx = document.getElementById('holdingChart').getContext('2d');
        if (window._holdChart) window._holdChart.destroy();
        window._holdChart = new Chart(holdCtx, {
            type: 'line',
            data: { labels: holdingDates, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(ctx) {
                                const label = ctx.dataset.label || '';
                                const val = ctx.parsed.y || 0;
                                if (val < 1) return null;
                                return `${label}: ${(val / 10000).toFixed(2)} 万`;
                            }
                        },
                        filter: function(item) {
                            return (item.parsed.y || 0) > 1;
                        }
                    }
                },
                scales: {
                    x: {
                        stacked: true,
                        ticks: { maxTicksLimit: 20, color: '#8899b0' },
                        grid: { color: '#1a222f' }
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        ticks: {
                            color: '#8899b0',
                            callback: v => (v / 10000).toFixed(0) + '万'
                        },
                        grid: { color: '#1a222f' },
                        title: { display: true, text: '市值（元）', color: '#8899b0' }
                    }
                }
            },
            plugins: [rebalanceLinesPlugin]
        });

        const legendWrap = document.getElementById('holdingLegend');
        legendWrap.innerHTML = '';

        const cashItem = document.createElement('span');
        cashItem.className = 'lg-item';
        cashItem.innerHTML = `<span class="swatch" style="background:rgba(136,153,176,0.9);"></span>现金`;
        legendWrap.appendChild(cashItem);

        activeStocks.forEach(col => {
            const name = col.includes('|') ? col.split('|')[1] : col;
            const item = document.createElement('span');
            item.className = 'lg-item';
            item.innerHTML = `
                <span class="swatch" style="background:${stockColors[col]};"></span>
                ${name || col}
            `;
            legendWrap.appendChild(item);
        });
    }
</script>

</body>
</html>
