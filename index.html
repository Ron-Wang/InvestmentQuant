<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InvestmentQuant · 策略与研究</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e17;
            color: #e6edf5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            padding: 40px 32px;
            background: #141b26;
            border-radius: 28px;
            border: 1px solid #26303f;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 38px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0c27f, #fc5c7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .header p {
            color: #8899b0;
            font-size: 16px;
            margin-top: 6px;
            border-bottom: 1px solid #1f2a3a;
            padding-bottom: 18px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #c8d8e8;
            margin: 32px 0 18px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i {
            color: #f0c27f;
        }
        .section-title .badge {
            font-size: 12px;
            background: #1f2a3a;
            padding: 2px 14px;
            border-radius: 20px;
            font-weight: 400;
            color: #7a8aa0;
        }
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card {
            background: #1a2332;
            border-radius: 16px;
            padding: 24px 20px;
            border: 1px solid #26303f;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: #e6edf5;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            position: relative;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #f0c27f;
            box-shadow: 0 8px 30px rgba(240, 194, 127, 0.08);
        }
        .card .icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .card .name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card .desc {
            font-size: 13px;
            color: #8899b0;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .card .tag {
            display: inline-block;
            background: #26303f;
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 11px;
            color: #b8c9dd;
            margin-top: auto;
        }
        .card .tag.strategy {
            background: #2a3a50;
            color: #f0c27f;
        }
        .card .tag.research {
            background: #2a3a50;
            color: #4cd9a0;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #4a5a70;
            border-top: 1px solid #1a222f;
            padding-top: 20px;
        }
        .footer i {
            margin-right: 6px;
        }

        @media (max-width: 700px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 24px 16px;
            }
            .header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 InvestmentQuant</h1>
        <p>量化策略 · 基金研究 · 数据驱动</p>
    </div>

    <!-- 策略模块 -->
    <div class="section-title">
        <i class="fas fa-chess-queen"></i> 策略 <span class="badge">回测 · 配置</span>
    </div>
    <div class="card-grid">
        <a href="./strategy-bank-chip/" class="card">
            <div class="icon">🏦</div>
            <div class="name">银行 · 科创芯片均衡</div>
            <div class="desc">6:4 比例 · 季度重平衡<br />回测区间 2022-2026</div>
            <span class="tag strategy">策略</span>
        </a>
        <!-- 未来更多策略可在此添加 -->
    </div>

    <!-- 研究模块 -->
    <div class="section-title">
        <i class="fas fa-microscope"></i> 研究 <span class="badge">分析 · 工具</span>
    </div>
    <div class="card-grid">
        <a href="./analysis-fund-sector/" class="card">
            <div class="icon">📈</div>
            <div class="name">主动权益行业仓位测算</div>
            <div class="desc">31个申万行业 + 债券/货基<br />自动加载 Excel，生成可视化看板</div>
            <span class="tag research">研究工具</span>
        </a>
        <a href="./analysis-pe-distribution/" class="card">
            <div class="icon">📊</div>
            <div class="name">沪深300 PE百分位分布</div>
            <div class="desc">PE百分位分布密度、累积曲线<br />自动加载 Excel，生成趋势与深度分析</div>
            <span class="tag research">研究工具</span>
        </a>
        <!-- 未来更多研究工具可在此添加 -->
    </div>

    <div class="footer">
        <i class="fas fa-code"></i> 托管于 GitHub Pages · 持续更新
    </div>
</div>

</body>
</html>
