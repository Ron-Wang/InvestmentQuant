<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品ETF动量轮动策略 · CMR</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e17;
            color: #e6edf5;
            padding: 24px;
            min-height: 100vh;
        }
        .container { max-width: 1440px; margin: 0 auto; }

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: #5a6a80;
            font-size: 18px;
        }
        .loading .spinner {
            display: inline-block;
            width: 40px; height: 40px;
            border: 4px solid #1f2a3a;
            border-top-color: #f0c27f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 28px;
            padding: 20px 24px;
            background: linear-gradient(145deg, #141b26, #0f1620);
            border-radius: 20px;
            border: 1px solid #26303f;
        }
        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0c27f, #fc5c7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .header-left .subtitle {
            font-size: 13px;
            color: #8899b0;
            margin-top: 4px;
        }
        .header-left .subtitle span {
            display: inline-block;
            background: #1f2a3a;
            padding: 0 12px;
            border-radius: 12px;
            margin-right: 6px;
        }
        .header-right {
            text-align: right;
            font-size: 13px;
            color: #8899b0;
        }
        .header-right .highlight { color: #f0c27f; }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }
        .kpi-card {
            background: #141b26;
            border-radius: 14px;
            padding: 14px 16px;
            border: 1px solid #1f2a3a;
            text-align: center;
        }
        .kpi-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #7a8aa0;
            margin-bottom: 4px;
        }
        .kpi-value { font-size: 22px; font-weight: 700; }
        .kpi-value.positive { color: #4cd9a0; }
        .kpi-value.negative { color: #fc6b6b; }
        .kpi-value.neutral  { color: #f0c27f; }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        .chart-box {
            background: #141b26;
            border-radius: 16px;
            padding: 18px 18px 10px;
            border: 1px solid #1f2a3a;
        }
        .chart-box.full { grid-column: 1 / -1; }
        .chart-box .chart-title {
            font-size: 15px;
            font-weight: 600;
            color: #c8d8e8;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-box .chart-title .badge {
            font-size: 10px;
            background: #1f2a3a;
            padding: 1px 12px;
            border-radius: 12px;
            color: #8899b0;
            font-weight: 400;
        }
        .chart-wrapper { position: relative; height: 260px; }
        .chart-wrapper.tall { height: 340px; }

        .table-wrap { overflow-x: auto; margin-top: 6px; }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .table-wrap th {
            text-align: left;
            padding: 8px 10px;
            color: #7a8aa0;
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
            border-bottom: 1px solid #1f2a3a;
        }
        .table-wrap td {
            padding: 7px 10px;
            border-bottom: 1px solid #1a222f;
            color: #d0dcec;
        }
        .table-wrap .num { font-family: 'JetBrains Mono', monospace; text-align: right; }
        .table-wrap .pos { color: #4cd9a0; }
        .table-wrap .neg { color: #fc6b6b; }

        .legend-inline {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-top: 8px;
            font-size: 12px;
            color: #8899b0;
        }
        .legend-inline .dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 3px;
            margin-right: 6px;
        }
        .text-muted { color: #5a6a80; font-size: 12px; }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .hidden { display: none !important; }

        @media (max-width: 900px) {
            .chart-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 10px; }
            .header-right { text-align: left; width: 100%; }
            .kpi-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 600px) {
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            body { padding: 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>正在加载策略数据 ...</div>
        </div>

        <div id="dashboard" class="hidden">
            <header class="header">
                <div class="header-left">
                    <h1>📊 商品 ETF 动量轮动策略 · CMR</h1>
                    <div class="subtitle">
                        <span>年化收益 × R² 动量</span>
                        <span>📅 月末调仓</span>
                        <span id="dateRange"></span>
                    </div>
                </div>
                <div class="header-right">
                    <div>基准：<span class="highlight">等权买入持有</span> · 7 只商品 ETF</div>
                    <div style="margin-top:4px;font-size:11px;color:#5a6a80;">
                        池：豆粕 · 黄金 · 有色 · 能化 · 白银 · 原油 · 信诚商品
                    </div>
                </div>
            </header>

            <div class="kpi-grid" id="kpiGrid"></div>

            <div class="chart-grid">
                <div class="chart-box full">
                    <div class="chart-title">📈 策略净值 vs 等权基准 <span class="badge">元</span></div>
                    <div class="chart-wrapper tall"><canvas id="navChart"></canvas></div>
                    <div class="legend-inline">
                        <span><span class="dot" style="background:#f0c27f;"></span>CMR 策略净值</span>
                        <span><span class="dot" style="background:#4a90d9;"></span>等权基准净值</span>
                    </div>
                </div>
            </div>

            <div class="chart-grid">
                <div class="chart-box">
                    <div class="chart-title">📊 年度收益率</div>
                    <div class="chart-wrapper"><canvas id="annualBarChart"></canvas></div>
                </div>
                <div class="chart-box">
                    <div class="chart-title">📉 年度最大回撤</div>
                    <div class="chart-wrapper"><canvas id="annualDrawdownChart"></canvas></div>
                </div>
            </div>

            <div class="chart-box full" style="margin-bottom:28px;">
                <div class="flex-between">
                    <div class="chart-title">📋 年度业绩明细</div>
                    <span class="text-muted">交易日数 · 风险调整指标</span>
                </div>
                <div class="table-wrap" id="annualTableWrap"></div>
            </div>

            <div class="chart-box full">
                <div class="chart-title">
                    🧩 持仓结构演化（7 只商品 ETF + 现金）
                    <span class="badge">面积 = 占总资产比例</span>
                </div>
                <div class="chart-wrapper tall"><canvas id="holdingChart"></canvas></div>
                <div class="legend-inline" id="holdingLegend"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 工具：解析 CSV（去 BOM，容错空值）
        // ============================================================
        function parseCSV(text) {
            if (!text) return [];
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
            if (!lines.length) return [];
            const headers = lines[0].split(',').map(h => h.trim());
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const vals = lines[i].split(',').map(v => v.trim());
                if (vals.length < headers.length) continue;
                const row = {};
                headers.forEach((h, idx) => {
                    let v = vals[idx];
                    if (v === undefined || v === null || v === '') {
                        row[h] = '';
                    } else if (!isNaN(v)) {
                        row[h] = parseFloat(v);
                    } else {
                        row[h] = v;
                    }
                });
                data.push(row);
            }
            return data;
        }

        // ============================================================
        // 格式化工具（全部容错）
        // ============================================================
        function fmtPct(v) {
            if (v === undefined || v === null || v === '') return '--';
            const num = parseFloat(v);
            if (isNaN(num)) return '--';
            return (num * 100).toFixed(1) + '%';
        }
        function fmtNum(v) {
            if (v === undefined || v === null || v === '') return '--';
            const num = parseFloat(v);
            if (isNaN(num)) return '--';
            return num.toFixed(2);
        }
        function fmtInt(v) {
            if (v === undefined || v === null || v === '') return '--';
            const num = parseInt(v, 10);
            if (isNaN(num)) return '--';
            return num;
        }

        // ============================================================
        // ETF 配置
        // ============================================================
        const ETF_CODES = [
            '159985.SZ', '518880.SH', '159980.SZ', '159981.SZ',
            '161226.SZ', '501018.SH', '165513.SZ',
        ];
        const ETF_NAMES = {
            '159985.SZ': '豆粕ETF',
            '518880.SH': '黄金ETF',
            '159980.SZ': '有色金属ETF',
            '159981.SZ': '能源化工ETF',
            '161226.SZ': '白银LOF',
            '501018.SH': '南方原油LOF',
            '165513.SZ': '信诚商品LOF',
        };
        const ETF_COLORS = {
            '159985.SZ': '#4cd9a0',
            '518880.SH': '#f0c27f',
            '159980.SZ': '#e67e22',
            '159981.SZ': '#3498db',
            '161226.SZ': '#bdc3c7',
            '501018.SH': '#9b59b6',
            '165513.SZ': '#e84393',
        };
        const CASH_COLOR = '#5a6a80';

        // ============================================================
        // 加载数据
        // ============================================================
        const files = [
            'cmr_metrics.csv',
            'cmr_nav.csv',
            'cmr_annual_metrics.csv',
            'cmr_holding.csv'
        ];

        let loadedData = {};

        Promise.all(files.map(file =>
            fetch(file)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status} — ${file}`);
                    return res.text();
                })
                .then(text => {
                    const key = file.replace('.csv', '');
                    loadedData[key] = parseCSV(text);
                    console.log(`[CMR] ${file}: ${loadedData[key].length} 行`);
                })
        )).then(() => {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            renderDashboard(loadedData);
        }).catch(err => {
            document.getElementById('loading').innerHTML = `
                <div style="color:#fc6b6b;font-size:20px;">⚠️ 数据加载失败</div>
                <div style="color:#8899b0;margin-top:12px;">${err.message}</div>
                <div style="color:#5a6a80;margin-top:8px;font-size:14px;">
                    请确保以下 CSV 文件与当前页面在同一目录：<br>
                    cmr_metrics.csv · cmr_nav.csv · cmr_annual_metrics.csv · cmr_holding.csv
                </div>`;
            console.error(err);
        });

        // ============================================================
        // 渲染看板
        // ============================================================
        function renderDashboard(data) {
            const metrics = data['cmr_metrics'] || [];
            const nav     = data['cmr_nav'] || [];
            const annual  = data['cmr_annual_metrics'] || [];
            const holding = data['cmr_holding'] || [];

            if (!nav.length || !metrics.length) {
                alert('关键数据为空，请检查 CSV 文件内容');
                return;
            }

            // ---------- 日期范围 ----------
            document.getElementById('dateRange').textContent =
                `${nav[0].date}  ~  ${nav[nav.length - 1].date}`;

            // ---------- KPI ----------
            const kpiMap = {};
            metrics.forEach(r => { kpiMap[r['指标']] = r['数值']; });

            const kpiConfig = [
                { label: '总收益率',   key: '总收益率',   fmt: v => (v * 100).toFixed(1) + '%' },
                { label: '年化收益率', key: '年化收益率', fmt: v => (v * 100).toFixed(1) + '%' },
                { label: '年化波动率', key: '年化波动率', fmt: v => (v * 100).toFixed(1) + '%' },
                { label: '夏普比率',   key: '夏普比率',   fmt: v => v.toFixed(2) },
                { label: '最大回撤',   key: '最大回撤',   fmt: v => (v * 100).toFixed(1) + '%' },
                { label: 'Calmar比率', key: 'Calmar比率', fmt: v => v.toFixed(2) },
            ];

            const kpiGrid = document.getElementById('kpiGrid');
            kpiGrid.innerHTML = '';
            kpiConfig.forEach(item => {
                const val = kpiMap[item.key];
                let cls = 'neutral';
                if (val !== undefined) {
                    if (item.key === '最大回撤') {
                        cls = (val < 0) ? 'negative' : 'positive';
                    } else if (['总收益率', '年化收益率', '夏普比率', 'Calmar比率'].includes(item.key)) {
                        cls = (val > 0) ? 'positive' : 'negative';
                    }
                }
                const div = document.createElement('div');
                div.className = 'kpi-card';
                div.innerHTML = `
                    <div class="kpi-label">${item.label}</div>
                    <div class="kpi-value ${cls}">${val !== undefined ? item.fmt(val) : '--'}</div>
                `;
                kpiGrid.appendChild(div);
            });

            // ---------- 净值曲线 ----------
            const dates    = nav.map(d => d.date);
            const strategy = nav.map(d => d['策略净值']);
            const bench    = nav.map(d => d['等权基准净值']);

            const navCtx = document.getElementById('navChart').getContext('2d');
            if (window._navChart) window._navChart.destroy();
            window._navChart = new Chart(navCtx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [
                        {
                            label: 'CMR策略净值',
                            data: strategy,
                            borderColor: '#f0c27f',
                            backgroundColor: 'rgba(240,194,127,0.1)',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.1,
                            fill: true,
                        },
                        {
                            label: '等权基准净值',
                            data: bench,
                            borderColor: '#4a90d9',
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.1,
                            borderDash: [4, 4],
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    const v = ctx.parsed.y;
                                    if (v === undefined || v === null) return null;
                                    return `${ctx.dataset.label}: ${(v / 10000).toFixed(2)} 万`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { maxTicksLimit: 20, color: '#8899b0' },
                            grid: { color: '#1a222f' }
                        },
                        y: {
                            ticks: {
                                color: '#8899b0',
                                callback: v => (v / 10000).toFixed(0) + '万'
                            },
                            grid: { color: '#1a222f' }
                        }
                    }
                }
            });

            // ---------- 年度指标 ----------
            const annualMap = {};
            annual.forEach(r => {
                const yr = r['年份'];
                if (yr === undefined || yr === null || yr === '') return;
                annualMap[yr] = {
                    ret:    parseFloat(r['总收益率']),
                    annRet: parseFloat(r['年化收益率']),
                    vol:    parseFloat(r['年化波动率']),
                    sharpe: parseFloat(r['夏普比率']),
                    dd:     parseFloat(r['最大回撤']),
                    calmar: parseFloat(r['Calmar比率']),
                    days:   r['交易日数'],
                };
            });
            const years = Object.keys(annualMap).sort();
            console.log('[CMR] 年度数据:', years, annualMap);

            const retValues = years.map(y => annualMap[y].ret * 100);
            const ddValues  = years.map(y => annualMap[y].dd * 100);

            // ---------- 年度收益率柱状图 ----------
            const barCtx = document.getElementById('annualBarChart').getContext('2d');
            if (window._barChart) window._barChart.destroy();
            window._barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: years,
                    datasets: [{
                        label: '年度收益率 (%)',
                        data: retValues,
                        backgroundColor: retValues.map(v =>
                            v >= 0 ? 'rgba(76,217,160,0.7)' : 'rgba(252,107,107,0.7)'),
                        borderColor: retValues.map(v =>
                            v >= 0 ? '#4cd9a0' : '#fc6b6b'),
                        borderWidth: 1.5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: ctx => `收益率: ${ctx.parsed.y.toFixed(1)}%`
                            }
                        }
                    },
                    scales: {
                        y: {
                            ticks: { callback: v => v + '%', color: '#8899b0' },
                            grid: { color: '#1a222f' }
                        },
                        x: { ticks: { color: '#8899b0' }, grid: { display: false } }
                    }
                }
            });

            // ---------- 年度最大回撤柱状图 ----------
            const ddCtx = document.getElementById('annualDrawdownChart').getContext('2d');
            if (window._ddChart) window._ddChart.destroy();
            window._ddChart = new Chart(ddCtx, {
                type: 'bar',
                data: {
                    labels: years,
                    datasets: [{
                        label: '最大回撤 (%)',
                        data: ddValues,
                        backgroundColor: 'rgba(252,107,107,0.6)',
                        borderColor: '#fc6b6b',
                        borderWidth: 1.5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: ctx => `回撤: ${ctx.parsed.y.toFixed(1)}%`
                            }
                        }
                    },
                    scales: {
                        y: {
                            ticks: { callback: v => v + '%', color: '#8899b0' },
                            grid: { color: '#1a222f' }
                        },
                        x: { ticks: { color: '#8899b0' }, grid: { display: false } }
                    }
                }
            });

            // ---------- 年度明细表（全部使用 fmt* 容错函数） ----------
            const tableWrap = document.getElementById('annualTableWrap');
            let tableHtml = `<table>
                <thead><tr>
                    <th>年份</th><th>总收益率</th><th>年化收益率</th><th>年化波动率</th>
                    <th>夏普比率</th><th>最大回撤</th><th>Calmar</th><th>交易日</th>
                </tr></thead><tbody>`;
            annual.forEach(r => {
                const tr   = parseFloat(r['总收益率']);
                const ar   = parseFloat(r['年化收益率']);
                const av   = r['年化波动率'];
                const sp   = r['夏普比率'];
                const mdd  = parseFloat(r['最大回撤']);
                const cm   = r['Calmar比率'];
                const days = r['交易日数'];

                const trCls = (isNaN(tr) || tr >= 0) ? 'pos' : 'neg';
                const arCls = (isNaN(ar) || ar >= 0) ? 'pos' : 'neg';

                tableHtml += `<tr>
                    <td>${r['年份'] ?? '--'}</td>
                    <td class="num ${trCls}">${fmtPct(tr)}</td>
                    <td class="num ${arCls}">${fmtPct(ar)}</td>
                    <td class="num">${fmtPct(av)}</td>
                    <td class="num">${fmtNum(sp)}</td>
                    <td class="num neg">${fmtPct(mdd)}</td>
                    <td class="num">${fmtNum(cm)}</td>
                    <td class="num">${fmtInt(days)}</td>
                </tr>`;
            });
            tableHtml += '</tbody></table>';
            tableWrap.innerHTML = tableHtml;

            // ---------- 持仓堆叠面积图 ----------
            const holdDates = holding.map(d => d.date);

            const etfPctData = ETF_CODES.map(code => {
                const key = `${code}_value`;
                return holding.map(d => {
                    const total = d.total_value || 0;
                    const val = d[key] || 0;
                    return total > 0 ? (val / total) * 100 : 0;
                });
            });
            const cashPct = holding.map(d => {
                const total = d.total_value || 0;
                return total > 0 ? ((d.cash || 0) / total) * 100 : 0;
            });

            const datasets = [];
            datasets.push({
                label: '现金',
                data: cashPct,
                borderColor: CASH_COLOR,
                backgroundColor: 'rgba(90,106,128,0.55)',
                borderWidth: 0.5,
                pointRadius: 0,
                fill: true,
                stack: 'holdings',
                tension: 0
            });
            ETF_CODES.forEach((code, i) => {
                datasets.push({
                    label: ETF_NAMES[code],
                    data: etfPctData[i],
                    borderColor: ETF_COLORS[code],
                    backgroundColor: ETF_COLORS[code] + '99',
                    borderWidth: 0.5,
                    pointRadius: 0,
                    fill: true,
                    stack: 'holdings',
                    tension: 0
                });
            });

            const holdCtx = document.getElementById('holdingChart').getContext('2d');
            if (window._holdChart) window._holdChart.destroy();
            window._holdChart = new Chart(holdCtx, {
                type: 'line',
                data: { labels: holdDates, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    const v = ctx.parsed.y;
                                    if (v === undefined || v === null) return null;
                                    return `${ctx.dataset.label}: ${v.toFixed(2)}%`;
                                },
                                footer: function(items) {
                                    if (!items.length) return '';
                                    let sum = 0;
                                    items.forEach(it => {
                                        const v = it.parsed.y;
                                        if (v !== undefined && v !== null && !isNaN(v)) sum += v;
                                    });
                                    return `合计: ${sum.toFixed(2)}%`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { maxTicksLimit: 20, color: '#8899b0' },
                            grid: { color: '#1a222f' }
                        },
                        y: {
                            min: 0,
                            max: 100,
                            stacked: true,
                            ticks: { callback: v => v + '%', color: '#8899b0' },
                            grid: { color: '#1a222f' },
                            title: {
                                display: true,
                                text: '占总资产比例 (%)',
                                color: '#8899b0'
                            }
                        }
                    }
                }
            });

            // 持仓图例
            const legendEl = document.getElementById('holdingLegend');
            legendEl.innerHTML = '';
            const allItems = [
                { label: '现金', color: CASH_COLOR },
                ...ETF_CODES.map(c => ({ label: ETF_NAMES[c], color: ETF_COLORS[c] }))
            ];
            allItems.forEach(item => {
                const span = document.createElement('span');
                span.innerHTML = `<span class="dot" style="background:${item.color};"></span>${item.label}`;
                legendEl.appendChild(span);
            });
        }
    </script>

</body>
</html>
