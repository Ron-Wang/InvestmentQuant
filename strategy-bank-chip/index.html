<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银行-科创芯片均衡策略 · 6:4 季度重平衡</title>
    <!-- Chart.js 轻量可视化 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e17;
            color: #e6edf5;
            padding: 24px;
            min-height: 100vh;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 80px 20px;
            color: #5a6a80;
            font-size: 18px;
        }
        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #1f2a3a;
            border-top-color: #f0c27f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 28px;
            padding: 20px 24px;
            background: linear-gradient(145deg, #141b26, #0f1620);
            border-radius: 20px;
            border: 1px solid #26303f;
        }
        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0c27f, #fc5c7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .header-left .subtitle {
            font-size: 13px;
            color: #8899b0;
            margin-top: 4px;
        }
        .header-left .subtitle span {
            display: inline-block;
            background: #1f2a3a;
            padding: 0 12px;
            border-radius: 12px;
            margin-right: 6px;
        }
        .header-right {
            text-align: right;
            font-size: 13px;
            color: #8899b0;
        }
        .header-right .highlight {
            color: #f0c27f;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }
        .kpi-card {
            background: #141b26;
            border-radius: 14px;
            padding: 14px 16px;
            border: 1px solid #1f2a3a;
            text-align: center;
        }
        .kpi-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #7a8aa0;
            margin-bottom: 4px;
        }
        .kpi-value {
            font-size: 22px;
            font-weight: 700;
        }
        .kpi-value.positive {
            color: #4cd9a0;
        }
        .kpi-value.negative {
            color: #fc6b6b;
        }
        .kpi-value.neutral {
            color: #f0c27f;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        .chart-box {
            background: #141b26;
            border-radius: 16px;
            padding: 18px 18px 10px;
            border: 1px solid #1f2a3a;
        }
        .chart-box.full {
            grid-column: 1 / -1;
        }
        .chart-box .chart-title {
            font-size: 15px;
            font-weight: 600;
            color: #c8d8e8;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-box .chart-title .badge {
            font-size: 10px;
            background: #1f2a3a;
            padding: 1px 12px;
            border-radius: 12px;
            color: #8899b0;
            font-weight: 400;
        }
        .chart-wrapper {
            position: relative;
            height: 260px;
        }
        .chart-wrapper.tall {
            height: 320px;
        }

        .table-wrap {
            overflow-x: auto;
            margin-top: 6px;
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .table-wrap th {
            text-align: left;
            padding: 8px 10px;
            color: #7a8aa0;
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
            border-bottom: 1px solid #1f2a3a;
        }
        .table-wrap td {
            padding: 7px 10px;
            border-bottom: 1px solid #1a222f;
            color: #d0dcec;
        }
        .table-wrap .num {
            font-family: 'JetBrains Mono', monospace;
            text-align: right;
        }
        .table-wrap .pos {
            color: #4cd9a0;
        }
        .table-wrap .neg {
            color: #fc6b6b;
        }

        .legend-inline {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-top: 6px;
            font-size: 12px;
            color: #8899b0;
        }
        .legend-inline .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            margin-right: 6px;
        }
        .text-muted {
            color: #5a6a80;
            font-size: 12px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .hidden {
            display: none !important;
        }

        @media (max-width: 900px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                gap: 10px;
            }
            .header-right {
                text-align: left;
                width: 100%;
            }
            .kpi-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 600px) {
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            body {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 加载提示 -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>正在加载策略数据 ...</div>
        </div>

        <!-- 看板（初始隐藏） -->
        <div id="dashboard" class="hidden">
            <header class="header">
                <div class="header-left">
                    <h1>🏦 银行 · 科创芯片 均衡策略</h1>
                    <div class="subtitle">
                        <span>6:4 比例</span>
                        <span>📅 季度重平衡</span>
                        <span id="dateRange"></span>
                    </div>
                </div>
                <div class="header-right">
                    <div>基准：<span class="highlight">银行ETF</span> + <span class="highlight">芯片ETF</span></div>
                    <div style="font-size:12px;color:#5a6a80;">数据来自 CSV · 自动渲染</div>
                </div>
            </header>

            <div class="kpi-grid" id="kpiGrid"></div>

            <div class="chart-grid">
                <div class="chart-box full">
                    <div class="chart-title">📈 策略净值 vs 基准 <span class="badge">标准化</span></div>
                    <div class="chart-wrapper tall"><canvas id="navChart"></canvas></div>
                    <div class="legend-inline">
                        <span><span class="dot" style="background:#f0c27f;"></span>策略净值</span>
                        <span><span class="dot" style="background:#4a90d9;"></span>银行ETF</span>
                        <span><span class="dot" style="background:#fc5c7d;"></span>芯片ETF</span>
                    </div>
                </div>
            </div>

            <div class="chart-grid">
                <div class="chart-box">
                    <div class="chart-title">📊 年度收益率</div>
                    <div class="chart-wrapper"><canvas id="annualBarChart"></canvas></div>
                </div>
                <div class="chart-box">
                    <div class="chart-title">📉 年度最大回撤</div>
                    <div class="chart-wrapper"><canvas id="annualDrawdownChart"></canvas></div>
                </div>
            </div>

            <div class="chart-box full" style="margin-bottom:28px;">
                <div class="flex-between">
                    <div class="chart-title">📋 年度业绩明细</div>
                    <span class="text-muted">交易日数 · 风险调整指标</span>
                </div>
                <div class="table-wrap" id="annualTableWrap"></div>
            </div>

            <div class="chart-box full">
                <div class="chart-title">
                    🧩 仓位配比（目标：银行 60% · 芯片 40%）
                    <span class="badge">虚线 = 目标仓位 · 竖线 = 再平衡</span>
                </div>
                <div class="chart-wrapper tall"><canvas id="holdingChart"></canvas></div>
                <div class="legend-inline">
                    <span><span class="dot" style="background:#4a90d9;"></span>银行仓位 %</span>
                    <span><span class="dot" style="background:#fc5c7d;"></span>芯片仓位 %</span>
                    <span><span class="dot" style="background:#f0c27f;opacity:0.6;"></span>目标仓位 60/40</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 工具函数：解析 CSV（去除 BOM）
        // ============================================================
        function parseCSV(text) {
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length === 0) return [];
            const headers = lines[0].split(',').map(h => h.trim());
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim());
                if (values.length < headers.length) continue;
                const row = {};
                headers.forEach((h, idx) => {
                    let val = values[idx] || '';
                    if (!isNaN(val) && val !== '') val = parseFloat(val);
                    row[h] = val;
                });
                data.push(row);
            }
            return data;
        }

        // 聚合年度收益/回撤（从净值数据计算）
        function aggregateAnnual(navData) {
            const years = {};
            navData.forEach(d => {
                const year = d.date.substring(0, 4);
                if (!years[year]) years[year] = {
                    start: d['策略净值'],
                    end: d['策略净值'],
                    max: d['策略净值'],
                    min: d['策略净值']
                };
                const val = d['策略净值'];
                if (val < years[year].min) years[year].min = val;
                if (val > years[year].max) years[year].max = val;
                years[year].end = val;
            });
            const keys = Object.keys(years).sort();
            const result = {};
            keys.forEach((y, idx) => {
                const start = years[y].start;
                const ret = (years[y].end - start) / start;
                const drawdown = (years[y].min - years[y].max) / years[y].max;
                result[y] = { return: ret, drawdown: drawdown };
            });
            return result;
        }

        // ============================================================
        // 主流程：加载四个 CSV，渲染看板
        // ============================================================
        const files = [
            'bcbs_metrics.csv',
            'bcbs_nav.csv',
            'bcbs_annual_metrics.csv',
            'bcbs_holding.csv'
        ];

        let loadedData = {};

        Promise.all(files.map(file =>
            fetch(file)
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status} — ${file}`);
                return res.text();
            })
            .then(text => {
                const key = file.replace('.csv', '');
                loadedData[key] = parseCSV(text);
            })
        )).then(() => {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            renderDashboard(loadedData);
        }).catch(err => {
            document.getElementById('loading').innerHTML = `
                <div style="color:#fc6b6b;font-size:20px;">⚠️ 数据加载失败</div>
                <div style="color:#8899b0;margin-top:12px;">${err.message}</div>
                <div style="color:#5a6a80;margin-top:8px;font-size:14px;">请确保以下 CSV 文件与当前页面在同一目录：<br>
                bcbs_metrics.csv, bcbs_nav.csv, bcbs_annual_metrics.csv, bcbs_holding.csv</div>
            `;
            console.error(err);
        });

        // ============================================================
        // 渲染函数
        // ============================================================
        function renderDashboard(data) {
            const metrics = data['bcbs_metrics'];
            const nav = data['bcbs_nav'];
            const annual = data['bcbs_annual_metrics'];
            const holding = data['bcbs_holding'];

            if (!nav || !nav.length || !metrics || !metrics.length) {
                alert('关键数据为空，请检查 CSV 文件内容');
                return;
            }

            // ---- 日期范围 ----
            const first = nav[0].date;
            const last = nav[nav.length - 1].date;
            document.getElementById('dateRange').textContent = `${first}  ~  ${last}`;

            // ---- KPI ----
            const kpiMap = {};
            metrics.forEach(row => { kpiMap[row['指标']] = row['数值']; });
            const kpiConfig = [
                { label: '总收益率', key: '总收益率', fmt: v => (v * 100).toFixed(1) + '%' },
                { label: '年化收益率', key: '年化收益率', fmt: v => (v * 100).toFixed(1) + '%' },
                { label: '年化波动率', key: '年化波动率', fmt: v => (v * 100).toFixed(1) + '%' },
                { label: '夏普比率', key: '夏普比率', fmt: v => v.toFixed(2) },
                { label: '最大回撤', key: '最大回撤', fmt: v => (v * 100).toFixed(1) + '%' },
                { label: 'Calmar比率', key: 'Calmar比率', fmt: v => v.toFixed(2) },
            ];
            const kpiGrid = document.getElementById('kpiGrid');
            kpiGrid.innerHTML = '';
            kpiConfig.forEach(item => {
                const val = kpiMap[item.key];
                let cls = 'neutral';
                if (val !== undefined) {
                    if (item.key === '最大回撤') cls = (val < 0) ? 'negative' : 'positive';
                    else if (['总收益率', '年化收益率', '夏普比率', 'Calmar比率'].includes(item.key)) cls = (val > 0) ?
                        'positive' : 'negative';
                }
                const div = document.createElement('div');
                div.className = 'kpi-card';
                div.innerHTML = `
                    <div class="kpi-label">${item.label}</div>
                    <div class="kpi-value ${cls}">${val !== undefined ? item.fmt(val) : '--'}</div>
                `;
                kpiGrid.appendChild(div);
            });

            // ---- 净值图 ----
            const dates = nav.map(d => d.date);
            const strategy = nav.map(d => d['策略净值']);
            const bank = nav.map(d => d['银行ETF基准净值']);
            const chip = nav.map(d => d['芯片ETF基准净值']);

            const navCtx = document.getElementById('navChart').getContext('2d');
            if (window._navChart) window._navChart.destroy();
            window._navChart = new Chart(navCtx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [
                        { label: '策略净值', data: strategy, borderColor: '#f0c27f', backgroundColor: 'rgba(240,194,127,0.1)',
                            borderWidth: 2, pointRadius: 0, tension: 0.1 },
                        { label: '银行ETF', data: bank, borderColor: '#4a90d9', borderWidth: 1.5,
                            pointRadius: 0, tension: 0.1, borderDash: [4, 4] },
                        { label: '芯片ETF', data: chip, borderColor: '#fc5c7d', borderWidth: 1.5,
                            pointRadius: 0, tension: 0.1, borderDash: [4, 4] }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
                    scales: {
                        x: { ticks: { maxTicksLimit: 20, color: '#8899b0' }, grid: { color: '#1a222f' } },
                        y: { ticks: { color: '#8899b0' }, grid: { color: '#1a222f' } }
                    }
                }
            });

            // ---- 年度收益率 ----
            const annualRet = aggregateAnnual(nav);
            const years = Object.keys(annualRet).sort();
            const retValues = years.map(y => annualRet[y].return * 100);
            const barCtx = document.getElementById('annualBarChart').getContext('2d');
            if (window._barChart) window._barChart.destroy();
            window._barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: years,
                    datasets: [{
                        label: '年度收益率 (%)',
                        data: retValues,
                        backgroundColor: retValues.map(v => v >= 0 ? 'rgba(76,217,160,0.7)' :
                            'rgba(252,107,107,0.7)'),
                        borderColor: retValues.map(v => v >= 0 ? '#4cd9a0' : '#fc6b6b'),
                        borderWidth: 1.5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { ticks: { callback: v => v + '%', color: '#8899b0' }, grid: { color: '#1a222f' } },
                        x: { ticks: { color: '#8899b0' }, grid: { display: false } }
                    }
                }
            });

            // ---- 年度最大回撤 ----
            const ddValues = years.map(y => annualRet[y].drawdown * 100);
            const ddCtx = document.getElementById('annualDrawdownChart').getContext('2d');
            if (window._ddChart) window._ddChart.destroy();
            window._ddChart = new Chart(ddCtx, {
                type: 'bar',
                data: {
                    labels: years,
                    datasets: [{
                        label: '最大回撤 (%)',
                        data: ddValues,
                        backgroundColor: 'rgba(252,107,107,0.6)',
                        borderColor: '#fc6b6b',
                        borderWidth: 1.5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { ticks: { callback: v => v + '%', color: '#8899b0' }, grid: { color: '#1a222f' } },
                        x: { ticks: { color: '#8899b0' }, grid: { display: false } }
                    }
                }
            });

            // ---- 年度表格 ----
            const tableWrap = document.getElementById('annualTableWrap');
            let tableHtml = `<table>
                <thead><tr>
                    <th>年份</th><th>总收益率</th><th>年化收益率</th><th>年化波动率</th>
                    <th>夏普比率</th><th>最大回撤</th><th>Calmar</th><th>交易日</th>
                </tr></thead><tbody>`;
            annual.forEach(row => {
                const yr = row['年份'];
                const totalRet = row['总收益率'];
                const annRet = row['年化收益率'];
                const annVol = row['年化波动率'];
                const sharpe = row['夏普比率'];
                const mdd = row['最大回撤'];
                const calmar = row['Calmar比率'];
                const days = row['交易日数'];
                tableHtml += `<tr>
                    <td>${yr}</td>
                    <td class="num ${totalRet >= 0 ? 'pos' : 'neg'}">${(totalRet*100).toFixed(1)}%</td>
                    <td class="num ${annRet >= 0 ? 'pos' : 'neg'}">${(annRet*100).toFixed(1)}%</td>
                    <td class="num">${(annVol*100).toFixed(1)}%</td>
                    <td class="num">${sharpe.toFixed(2)}</td>
                    <td class="num neg">${(mdd*100).toFixed(1)}%</td>
                    <td class="num">${calmar.toFixed(2)}</td>
                    <td class="num">${days}</td>
                </tr>`;
            });
            tableHtml += '</tbody></table>';
            tableWrap.innerHTML = tableHtml;

            // ---- 持仓图（改进版：仓位百分比 + 目标线 + 再平衡标记）----
            const holdingDates = holding.map(d => d.date);

            // 计算银行和芯片仓位百分比（基于市值 / 总净值）
            const bankPct = holding.map(d => {
                const total = (d.bank_value || 0) + (d.chip_value || 0) + (d.cash || 0);
                return total > 0 ? (d.bank_value / total) * 100 : 0;
            });
            const chipPct = holding.map(d => {
                const total = (d.bank_value || 0) + (d.chip_value || 0) + (d.cash || 0);
                return total > 0 ? (d.chip_value / total) * 100 : 0;
            });

            // 找出季度重平衡日期（仓位跳变超过 3% 的日子）
            const rebalanceDates = [];
            for (let i = 1; i < bankPct.length; i++) {
                if (Math.abs(bankPct[i] - bankPct[i - 1]) > 3) {
                    rebalanceDates.push(holdingDates[i]);
                }
            }

            // 自定义插件：在再平衡日期画竖直虚线
            const rebalancePlugin = {
                id: 'rebalanceLines',
                afterDatasetsDraw(chart) {
                    const { ctx, chartArea, scales } = chart;
                    if (!rebalanceDates.length || !chartArea) return;
                    const xScale = scales.x;
                    ctx.save();
                    ctx.strokeStyle = 'rgba(240, 194, 127, 0.35)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 3]);
                    rebalanceDates.forEach(date => {
                        const idx = holdingDates.indexOf(date);
                        if (idx === -1) return;
                        const x = xScale.getPixelForValue(idx);
                        if (x < chartArea.left || x > chartArea.right) return;
                        ctx.beginPath();
                        ctx.moveTo(x, chartArea.top);
                        ctx.lineTo(x, chartArea.bottom);
                        ctx.stroke();
                    });
                    ctx.restore();
                }
            };

            const holdCtx = document.getElementById('holdingChart').getContext('2d');
            if (window._holdChart) window._holdChart.destroy();
            window._holdChart = new Chart(holdCtx, {
                type: 'line',
                data: {
                    labels: holdingDates,
                    datasets: [
                        {
                            label: '银行仓位 %',
                            data: bankPct,
                            borderColor: '#4a90d9',
                            backgroundColor: 'rgba(74,144,217,0.15)',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.15,
                            fill: true
                        },
                        {
                            label: '芯片仓位 %',
                            data: chipPct,
                            borderColor: '#fc5c7d',
                            backgroundColor: 'rgba(252,92,125,0.15)',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.15,
                            fill: true
                        },
                        {
                            label: '银行目标 60%',
                            data: holdingDates.map(() => 60),
                            borderColor: 'rgba(240,194,127,0.6)',
                            borderWidth: 1.5,
                            borderDash: [6, 4],
                            pointRadius: 0,
                            fill: false
                        },
                        {
                            label: '芯片目标 40%',
                            data: holdingDates.map(() => 40),
                            borderColor: 'rgba(240,194,127,0.6)',
                            borderWidth: 1.5,
                            borderDash: [6, 4],
                            pointRadius: 0,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    const label = ctx.dataset.label || '';
                                    const val = ctx.parsed.y;
                                    return `${label}: ${val.toFixed(2)}%`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { maxTicksLimit: 20, color: '#8899b0' },
                            grid: { color: '#1a222f' }
                        },
                        y: {
                            min: 0,
                            max: 100,
                            ticks: { callback: v => v + '%', color: '#8899b0' },
                            grid: { color: '#1a222f' },
                            title: {
                                display: true,
                                text: '仓位占比 (%)',
                                color: '#8899b0'
                            }
                        }
                    }
                },
                plugins: [rebalancePlugin]
            });
        }
    </script>

</body>
</html>
